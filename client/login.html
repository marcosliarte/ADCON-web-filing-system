<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - ADCON</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f2f5; }
        .login-container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; }
        h1 { text-align: center; color: #333; }
        .input-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; }
        input { width: 100%; padding: 0.5rem; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 0.7rem; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        button:hover { background-color: #0056b3; }
        #error-message { color: red; text-align: center; margin-top: 1rem; display: none; }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Login</h1>
        <form id="login-form">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autocomplete="email">
            </div>
            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Entrar</button>
        </form>
        <p id="error-message"></p>
        <p style="font-size: 0.8em; text-align: center; margin-top: 1em;">Use as credenciais que você registrou.</p>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('error-message');

            // Constrói a URL da API dinamicamente, forçando o protocolo HTTP.
            // window.location.hostname pega o IP (ex: 192.168.1.10) ou 'localhost' da barra de endereço.
            const apiUrl = `http://${window.location.hostname}:3000/api/auth/login`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha: password })
                });

                const data = await response.json();
                console.log('Resposta do servidor:', data); // Adicionado para debug

                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    window.location.href = 'home.html'; // Redireciona para a nova página inicial
                } else {
                    let errorText = data.msg || 'Erro ao fazer login.';
                    if (data.errors && Array.isArray(data.errors) && data.errors.length > 0) {
                        errorText = data.errors[0].msg; // Pega a primeira mensagem de erro
                    }
                    errorMessage.textContent = errorText;
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                console.error('Erro na requisição:', error); // Adicionado para debug
                errorMessage.textContent = 'Erro de conexão com o servidor.';
                errorMessage.style.display = 'block';

            }
        });
    </script>
</body>
</html>
