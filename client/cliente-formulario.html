<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Empresa</title>
</head>
<body style="display: none;">
  <!-- Script de bloqueio de acesso e exibição de conteúdo -->
  <script>
    if (localStorage.getItem('token')) {
      document.body.style.display = 'block';
    } else {
      window.location.replace('login.html');
    }
  </script>

  <h2>Cadastro de Empresa</h2>
  <form id="formulario-empresa">
    <div id="etapa-1">
      <label for="cnpj">CNPJ:</label>
      <input type="text" id="cnpj" name="cnpj" required><br>
      <button type="button" onclick="proximaEtapa(2)">Avançar</button>
    </div>

    <div id="etapa-2" style="display: none;">
      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" required><br>
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required><br>
      <button type="button" onclick="proximaEtapa(3)">Avançar</button>
    </div>

    <div id="etapa-3" style="display: none;">
      <label for="arquivo">Arquivo PDF:</label>
      <input type="file" id="arquivo" name="arquivo" accept="application/pdf" required><br>
      <button type="submit">Enviar</button>
    </div>
  </form>

  <div id="mensagem"></div>

  <script>
    console.log("Script cliente-formulario.html iniciado.");
    async function fetchWithAuth(url, options = {}) {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = 'login.html';
        return;
      }

      const headers = {
        ...options.headers,
        'x-auth-token': token
      };

      const response = await fetch(url, { ...options, headers });

      if (response.status === 401 || response.status === 403) {
        window.location.href = 'login.html';
        return;
      }

      return response;
    }
  
    function proximaEtapa(etapa) {
      document.getElementById('etapa-' + (etapa - 1)).style.display = 'none';
      document.getElementById('etapa-' + etapa).style.display = 'block';
    }

    document.getElementById('formulario-empresa').addEventListener('submit', async function(e) {
      e.preventDefault();

      const formData = new FormData(this);

      try {
        const response = await fetchWithAuth('/api/empresas', {
          method: 'POST',
          body: formData
        });

        if(response) {
            if (!response.ok) {
              const errorData = await response.json();
              throw new Error(errorData.message || 'Erro na comunicação com o servidor');
            }
    
            const result = await response.json();
    
            document.getElementById('mensagem').innerText = 'Cadastro realizado com sucesso!';
            setTimeout(() => {
                window.location.href = 'empresas.html';
            }, 2000);
        }

      } catch (error) {
        console.error('Erro ao enviar dados:', error);
        document.getElementById('mensagem').innerText = 'Erro ao enviar os dados: ' + error.message;
      }
    });

  </script>
</body>
</html>
