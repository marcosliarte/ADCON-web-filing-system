<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Empresa</title>
</head>
<body>
  <h2>Cadastro de Empresa</h2>
  <form id="formulario-empresa">
    <div id="etapa-1">
      <label for="cnpj">CNPJ:</label>
      <input type="text" id="cnpj" name="cnpj" required><br>
      <button type="button" onclick="proximaEtapa(2)">Avançar</button>
    </div>

    <div id="etapa-2" style="display: none;">
      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" required><br>
      <button type="button" onclick="proximaEtapa(3)">Avançar</button>
    </div>

    <div id="etapa-3" style="display: none;">
      <label for="arquivo">Arquivo PDF:</label>
      <input type="file" id="arquivo" name="arquivo" accept="application/pdf" required><br>
      <button type="submit">Enviar</button>
    </div>
  </form>

  <div id="mensagem"></div>

  <script>
    // Função para avançar de etapa
    function proximaEtapa(etapa) {
      document.getElementById('etapa-' + (etapa - 1)).style.display = 'none';
      document.getElementById('etapa-' + etapa).style.display = 'block';
    }

    // Enviar os dados via fetch
    document.getElementById('formulario-empresa').addEventListener('submit', async function(e) {
      e.preventDefault();

      // Criação do FormData para enviar o arquivo
      const formData = new FormData(this);

      try {
        const response = await fetch('/api/empresa', {
          method: 'POST',
          body: formData
        });

        // Verificando se a resposta foi OK
        if (!response.ok) {
          throw new Error('Erro na comunicação com o servidor');
        }

        const result = await response.json();

        // Exibindo a resposta no frontend
        document.getElementById('mensagem').innerText = result.mensagem || result.erro || 'Cadastro realizado com sucesso!';
      } catch (error) {
        // Captura de erro em caso de falha na comunicação
        console.error('Erro ao enviar dados:', error);
        document.getElementById('mensagem').innerText = 'Erro ao enviar os dados';
      }
    });
  </script>
</body>
</html>
