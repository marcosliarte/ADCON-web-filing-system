<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Detalhes da Empresa</title>
  <style>
    /* ... (estilos permanecem os mesmos) ... */
  </style>
</head>
<body style="display: none;">
  <!-- Script de bloqueio de acesso e exibição de conteúdo -->
  <script>
    if (localStorage.getItem('token')) {
      document.body.style.display = 'block';
    } else {
      window.location.replace('login.html');
    }
  </script>

  <div class="container">
    <h1>Detalhes da Empresa</h1>
    
    <div id="loading" class="loading">Carregando dados da empresa...</div>
    
    <div id="error-container" style="display: none;">
      <div class="error-message" id="error-message"></div>
      <button class="btn btn-back" onclick="window.history.back()">Voltar</button>
    </div>
    
    <div id="content" style="display: none;">
      <div class="section">
        <h2>Informações Básicas</h2>
        <div class="info-grid">
          <div class="info-item">
            <span class="info-label">ID:</span>
            <span class="info-value" id="empresa-id"></span>
          </div>
          <div class="info-item">
            <span class="info-label">Nome:</span>
            <span class="info-value" id="nome-empresa"></span>
          </div>
          <div class="info-item">
            <span class="info-label">CNPJ:</span>
            <span class="info-value" id="cnpj-empresa"></span>
          </div>
        </div>
      </div>
      
      <div class="section" id="arquivo-section" style="display: none;">
        <h2>Documento Anexado</h2>
        <div class="document-container">
          <div class="document-info">
            <span id="nome-arquivo"></span>
            <span id="tipo-arquivo" style="display: none;"></span>
          </div>
          <div class="document-actions">
            <button class="btn btn-download" id="btn-download">Download</button>
            <button class="btn btn-view" id="btn-visualizar">Visualizar</button>
          </div>
        </div>
        <div id="visualizador-container">
          <iframe id="visualizador-arquivo"></iframe>
        </div>
      </div>
      
      <div class="action-buttons">
        <button class="btn btn-back" onclick="window.history.back()">Voltar</button>
        <button class="btn btn-edit" id="btn-editar" style="display: none;">Editar</button>
        <button class="btn btn-share" id="btn-compartilhar">Compartilhar</button>
        <button class="btn btn-print" onclick="window.print()">Imprimir</button>
      </div>
    </div>
  </div>

  <script>
    const BASE_UPLOADS_URL = '/uploads/';
    let usuario;

    async function fetchWithAuth(url, options = {}) {
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'login.html';
            return;
        }

        const headers = {
            ...options.headers,
            'x-auth-token': token
        };

        const response = await fetch(url, { ...options, headers });

        if (response.status === 401 || response.status === 403) {
            window.location.href = 'login.html';
            return;
        }

        return response;
    }

    async function getUsuario() {
        const response = await fetchWithAuth('/api/auth');
        if(response) {
            usuario = await response.json();
            if (usuario.role === 'admin' || usuario.role === 'funcionario') {
                document.getElementById('btn-editar').style.display = 'inline-block';
            } else {
                // Empresário não pode editar
                document.getElementById('btn-editar').style.display = 'none';
            }
        }
    }

    async function carregarDadosEmpresa() {
      try {
        mostrarLoading(true);
        esconderErro();
        esconderConteudo();
        
        const urlParams = new URLSearchParams(window.location.search);
        const empresaId = urlParams.get('id');
        
        if (!empresaId) {
          throw new Error('ID da empresa não fornecido na URL');
        }
        
        const response = await fetchWithAuth(`/api/empresas/${empresaId}`);
        
        if(response) {
            if (!response.ok) {
              const errorData = await response.json();
              throw new Error(errorData.message || 'Erro ao carregar dados da empresa');
            }
            
            const data = await response.json();
            
            document.getElementById('empresa-id').textContent = data._id;
            document.getElementById('nome-empresa').textContent = data.nome;
            document.getElementById('cnpj-empresa').textContent = formatarCNPJ(data.cnpj);
            
            document.getElementById('btn-editar').onclick = () => {
                window.location.href = `editar.html?id=${data._id}`;
            };
            
            document.getElementById('btn-compartilhar').onclick = () => {
              compartilharEmpresa(data);
            };
            
            // A informação do arquivo vem do array 'certidoes'
            if (data.certidoes && data.certidoes.length > 0) {
              const arquivo = data.certidoes[0];
              const extensao = arquivo.nomeArquivo.split('.').pop().toLowerCase();
              const urlArquivo = arquivo.caminhoArquivo; // O caminho já é o correto
              
              document.getElementById('nome-arquivo').textContent = arquivo.nomeArquivo;
              document.getElementById('tipo-arquivo').textContent = extensao;
              
              document.getElementById('btn-download').onclick = () => {
                window.open(urlArquivo, '_blank'); // Abre o arquivo para download/visualização
              };
              
              document.getElementById('btn-visualizar').onclick = () => {
                visualizarDocumento(urlArquivo, extensao);
              };
              
              document.getElementById('arquivo-section').style.display = 'block';
            }
            
            mostrarConteudo();
        }
        
      } catch (error) {
        console.error('Erro ao carregar dados da empresa:', error);
        mostrarErro(error.message);
      } finally {
        mostrarLoading(false);
      }
    }
    
    // ... (outras funções como visualizarDocumento, formatarCNPJ, etc. permanecem as mesmas)

    document.addEventListener('DOMContentLoaded', async () => {
        await getUsuario();
        carregarDadosEmpresa();
    });
  </script>
</body>
</html>
