<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Empresas Cadastradas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/empresas.css">
</head>
<body>
  <div id="header-placeholder"></div>

  <div class="page-container">
    <h1>Empresas Cadastradas</h1>

    <div class="search-container">
      <div class="search-wrapper">
        <input type="text" id="busca" placeholder="Buscar por nome ou CNPJ" autocomplete="off">
        <div id="autocomplete-list" class="autocomplete-list"></div>
      </div>
      <button id="btn-cadastrar" style="display: none;">Cadastrar Nova Empresa</button>
      <span id="loading" class="loading" style="display: none;">Carregando...</span>
    </div>

    <div class="table-responsive">
    <table>
      <thead>
        <tr>
          <th id="th-cnpj" data-sort="cnpj">CNPJ</th>
          <th id="th-nome" data-sort="nome">Nome Empresarial</th>
          <th id="th-dataCadastro" data-sort="dataCadastro">Data de Cadastro</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="lista-empresas">
        <tr>
          <td colspan="4">Carregando empresas...</td>
        </tr>
      </tbody>
    </table>
    </div>

    <div class="pagination">
      <button id="btn-anterior" disabled>&lt; Anterior</button>
      <span id="pagina-atual"></span>
      <button id="btn-proximo" disabled>&gt; Próximo</button>
    </div>
  </div>

  <script src="shared.js"></script>
  <script src="js/pages/empresas.js"></script>
</body>
</html>
