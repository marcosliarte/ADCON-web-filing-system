<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Empresas Cadastradas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: left;
    }
    th {
      background-color: #f2f2f2;
      cursor: pointer;
      position: relative;
    }
    th:hover {
      background-color: #e6e6e6;
    }
    th.sorted-asc::after {
      content: " ↑";
      font-size: 12px;
    }
    th.sorted-desc::after {
      content: " ↓";
      font-size: 12px;
    }
    .search-container {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    #busca {
      padding: 8px;
      width: 300px;
    }
    button {
      padding: 8px 16px;
      cursor: pointer;
    }
    .pagination {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
    }
    .pagination button {
      padding: 6px 12px;
    }
    .disabled {
      opacity: 0.5;
      pointer-events: none;
    }
    .actions button {
      margin-right: 5px;
    }
    .loading {
      display: inline-block;
      margin-left: 10px;
    }
  </style>
</head>
<body>
  <h1>Empresas Cadastradas</h1>

  <div class="search-container">
    <input type="text" id="busca" placeholder="Buscar por nome ou CNPJ">
    <button id="btn-buscar" onclick="buscarEmpresas()">Buscar</button>
    <button onclick="window.location.href='cliente-formulario.html'">Cadastrar Nova Empresa</button>
    <span id="loading" class="loading" style="display: none;">Carregando...</span>
  </div>

  <table>
    <thead>
      <tr>
        <th id="th-cnpj" onclick="ordenarPor('cnpj')">CNPJ</th>
        <th id="th-nome" onclick="ordenarPor('nome')">Nome</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="lista-empresas">
      <tr>
        <td colspan="3">Carregando empresas...</td>
      </tr>
    </tbody>
  </table>

  <div class="pagination">
    <button id="btn-anterior" onclick="paginaAnterior()">Anterior</button>
    <span id="pagina-atual">Página 1 de 1</span>
    <button id="btn-proximo" onclick="proximaPagina()">Próxima</button>
  </div>

  <script>
    let pagina = 1;
    let ordenacao = 'nome';
    let direcao = 'asc';
    let termoBusca = '';
    let totalPaginas = 1;

    async function carregarEmpresas() {
      try {
        mostrarLoading(true);
        
        const response = await fetch(
          `/api/empresas?pagina=${pagina}&limite=10&busca=${encodeURIComponent(termoBusca)}&ordenacao=${ordenacao}&direcao=${direcao}`
        );
        
        if (!response.ok) {
          throw new Error(`Erro ${response.status}: ${response.statusText}`);
        }
        
        const { data, meta } = await response.json();
        totalPaginas = meta.paginacao.totalPaginas;

        atualizarTabela(data);
        atualizarPaginacao();
        atualizarOrdenacaoUI();

      } catch (error) {
        console.error('Erro ao carregar empresas:', error);
        document.getElementById('lista-empresas').innerHTML = `
          <tr>
            <td colspan="3" style="color: red;">Erro ao carregar empresas: ${error.message}</td>
          </tr>
        `;
      } finally {
        mostrarLoading(false);
      }
    }

    function atualizarTabela(empresas) {
      const tabela = document.getElementById('lista-empresas');
      
      if (empresas.length === 0) {
        tabela.innerHTML = `
          <tr>
            <td colspan="3">Nenhuma empresa encontrada</td>
          </tr>
        `;
        return;
      }

      tabela.innerHTML = empresas.map(empresa => `
        <tr>
          <td>${formatarCNPJ(empresa.cnpj)}</td>
          <td>${empresa.nome}</td>
          <td class="actions">
            <button onclick="visualizarEmpresa('${empresa.id}')">Visualizar</button>
            <button onclick="editarEmpresa('${empresa.id}')">Editar</button>
            <button onclick="confirmarExclusao('${empresa.id}')">Excluir</button>
          </td>
        </tr>
      `).join('');
    }

    function atualizarPaginacao() {
      document.getElementById('pagina-atual').innerText = `Página ${pagina} de ${totalPaginas}`;
      document.getElementById('btn-anterior').className = pagina <= 1 ? 'disabled' : '';
      document.getElementById('btn-proximo').className = pagina >= totalPaginas ? 'disabled' : '';
    }

    function atualizarOrdenacaoUI() {
      // Remove todas as classes de ordenação
      document.querySelectorAll('th').forEach(th => {
        th.classList.remove('sorted-asc', 'sorted-desc');
      });
      
      // Adiciona classe ao cabeçalho ordenado
      const th = document.getElementById(`th-${ordenacao}`);
      if (th) {
        th.classList.add(direcao === 'asc' ? 'sorted-asc' : 'sorted-desc');
      }
    }

    function mostrarLoading(mostrar) {
      document.getElementById('loading').style.display = mostrar ? 'inline-block' : 'none';
      document.getElementById('btn-buscar').disabled = mostrar;
    }

    function formatarCNPJ(cnpj) {
      return cnpj.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5');
    }

    function ordenarPor(campo) {
      if (ordenacao === campo) {
        direcao = direcao === 'asc' ? 'desc' : 'asc';
      } else {
        ordenacao = campo;
        direcao = 'asc';
      }
      pagina = 1;
      carregarEmpresas();
    }

    function buscarEmpresas() {
      termoBusca = document.getElementById('busca').value.trim();
      pagina = 1;
      carregarEmpresas();
    }

    function proximaPagina() {
      if (pagina < totalPaginas) {
        pagina++;
        carregarEmpresas();
      }
    }

    function paginaAnterior() {
      if (pagina > 1) {
        pagina--;
        carregarEmpresas();
      }
    }

    function visualizarEmpresa(id) {
      window.location.href = `detalhes-empresa.html?id=${id}`;
    }

    function editarEmpresa(id) {
      window.location.href = `editar.html?id=${id}`;
    }

    async function confirmarExclusao(id) {
      if (confirm('Tem certeza que deseja excluir esta empresa?')) {
        try {
          mostrarLoading(true);
          const response = await fetch(`/api/empresa/${id}`, {
            method: 'DELETE'
          });
          
          const result = await response.json();
          
          if (!response.ok) {
            throw new Error(result.message || 'Erro ao excluir empresa');
          }
          
          alert('Empresa excluída com sucesso!');
          carregarEmpresas();
        } catch (error) {
          console.error('Erro:', error);
          alert(`Erro ao excluir empresa: ${error.message}`);
        } finally {
          mostrarLoading(false);
        }
      }
    }

    // Event listeners
    document.addEventListener('DOMContentLoaded', () => {
      carregarEmpresas();
      
      document.getElementById('busca').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          buscarEmpresas();
        }
      });
    });
  </script>
</body>
</html>
