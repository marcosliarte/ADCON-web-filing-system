<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Empresas Cadastradas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* Estilos do cabeçalho (copiados de home.html para consistência) */
    .header { background-color: #007bff; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); }
    .header h1 { margin: 0; font-size: 1.5rem; }
    .dropdown { position: relative; display: inline-block; }
    .dropdown-toggle { background-color: transparent; border: none; color: white; padding: 0.5rem; font-size: 1rem; cursor: pointer; display: flex; align-items: center; }
    .dropdown-content { display: none; position: absolute; right: 0; background-color: white; min-width: 180px; box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2); z-index: 1; border-radius: 5px; overflow: hidden; }
    .dropdown-content a { color: #333a40; padding: 12px 16px; text-decoration: none; display: flex; align-items: center; gap: 10px; }
    .dropdown-content a:hover { background-color: #f1f1f1; }
    .show { display: block; }

    /* Estilos da página */
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background-color: #f4f7f6; }
    .page-container { max-width: 1200px; margin: 2rem auto; padding: 2rem; background-color: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    h1 { color: #007bff; border-bottom: 2px solid #007bff; padding-bottom: 0.5rem; margin-bottom: 1.5rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1em; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #f2f2f2; cursor: pointer; }
    th:hover { background-color: #e0e0e0; }
    /* --- CORREÇÃO DE DESIGN --- */
    /* Estilo para os links dos nomes das empresas na tabela */
    #lista-empresas a {
        color: #007bff; /* Mantém a cor azul padrão do sistema */
        text-decoration: none; /* Remove o sublinhado padrão */
        font-weight: 500; /* Dá um leve destaque ao nome */
    }
    /* Garante que a cor não mude após o clique */
    #lista-empresas a:visited { color: #007bff; }
    /* Adiciona um sublinhado ao passar o mouse para indicar que é clicável */
    #lista-empresas a:hover { text-decoration: underline; }
    .search-container { margin-bottom: 1.5rem; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
    .search-container input { padding: 0.6rem; border: 1px solid #ced4da; border-radius: 5px; flex-grow: 1; }
    button { background-color: #007bff; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 5px; cursor: pointer; font-size: 0.95rem; transition: background-color 0.2s ease; }
    button:hover { background-color: #0056b3; }
    button.delete-btn { background-color: #dc3545; }
    button.delete-btn:hover { background-color: #c82333; }
    .pagination { margin-top: 1em; }
    .pagination button { margin: 0 5px; }
    .actions button { margin-right: 5px; }
    .loading { margin-left: 10px; font-style: italic; color: #555; }
    .arrow { display: inline-block; margin-left: 5px; }
  </style>
</head>
<body style="display: none;">
  <!-- Script de bloqueio de acesso e exibição de conteúdo -->
  <script>
    if (localStorage.getItem('token')) {
      document.body.style.display = 'block';
    } else {
      window.location.replace('login.html');
    }
  </script>

  <div id="header-placeholder"></div>

  <div class="page-container">
    <h1>Empresas Cadastradas</h1>

    <div class="search-container">
      <input type="text" id="busca" placeholder="Buscar por nome ou CNPJ">
      <button id="btn-buscar" onclick="buscarEmpresas()">Buscar</button>
      <button id="btn-cadastrar" onclick="window.location.href='cliente-formulario.html'" style="display: none;">Cadastrar Nova Empresa</button>
      <span id="loading" class="loading" style="display: none;">Carregando...</span>
    </div>

    <table>
      <thead>
        <tr>
          <th id="th-cnpj" onclick="ordenarPor('cnpj')">CNPJ</th>
          <th id="th-nome" onclick="ordenarPor('nome')">Nome Empresarial</th>
          <th id="th-dataCadastro" onclick="ordenarPor('dataCadastro')">Data de Cadastro</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="lista-empresas">
        <tr>
          <td colspan="4">Carregando empresas...</td>
        </tr>
      </tbody>
    </table>

    <div class="pagination">
      <button id="btn-anterior" onclick="paginaAnterior()" disabled>&lt; Anterior</button>
      <span id="pagina-atual"></span>
      <button id="btn-proximo" onclick="proximaPagina()" disabled>&gt; Próximo</button>
    </div>
  </div>

  <script src="shared.js"></script>
  <!-- CORREÇÃO: Adiciona a referência ao arquivo JS correto -->
  <script src="empresas.js"></script>
</body>
</html>
