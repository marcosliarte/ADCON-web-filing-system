<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ADCON - Logs de Atividade</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/pages/logs.css">
</head>
<body style="display: none;">
    <script>
        if (!localStorage.getItem('token')) {
            window.location.replace('login.html');
        }
    </script>
    <div id="header-placeholder"></div>

    <div class="container">
        <h1 class="page-title">Logs de Atividade do Sistema</h1>
        <p>Exibindo os últimos 500 registros de atividades.</p>

        <div class="filtros">
            <input type="text" id="filtro-usuario" placeholder="Filtrar por usuário...">
            <input type="text" id="filtro-entidade" placeholder="Filtrar por empresa/usuário afetado...">
            <select id="filtro-acao">
                <option value="">Todas as Ações</option>
                <option value="Criação de Empresa">Criação de Empresa</option>
                <option value="Edição de Empresa">Edição de Empresa</option>
                <option value="Exclusão de Empresa">Exclusão de Empresa</option>
                <option value="Criação de Usuário">Criação de Usuário</option>
                <option value="Exclusão de Usuário">Exclusão de Usuário</option>
                <option value="Alteração de Perfil">Alteração de Perfil</option>
            </select>
            <input type="date" id="filtro-data-inicio" title="Data de Início">
            <input type="date" id="filtro-data-fim" title="Data de Fim">
            <button>Filtrar</button>
        </div>

        <table id="tabela-logs">
            <thead>
                <tr>
                    <th>Data e Hora</th>
                    <th>Usuário</th>
                    <th>Ação</th>
                    <th>Entidade Afetada</th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="4">Carregando logs...</td></tr>
            </tbody>
        </table>
    </div>

    <script src="shared.js"></script>
    <script src="js/pages/logs.js"></script>
</body>
</html>
