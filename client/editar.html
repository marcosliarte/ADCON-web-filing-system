<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Editar Empresa</title>
  <style>
    /* ... (estilos permanecem os mesmos) ... */
  </style>
</head>
<body style="display: none;">
  <!-- Script de bloqueio de acesso e exibição de conteúdo -->
  <script>
    if (localStorage.getItem('token')) {
      document.body.style.display = 'block';
    } else {
      window.location.replace('login.html');
    }
  </script>

  <div class="form-container">
    <h1>Editar Empresa</h1>
    
    <form id="editForm">
      <input type="hidden" id="empresaId">
      
      <div class="form-group">
        <label for="cnpj">CNPJ:</label>
        <input type="text" id="cnpj" required>
      </div>
      
      <div class="form-group">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" required>
      </div>

      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" required>
      </div>
      
      <div class="file-section">
        <label>Arquivo Atual:</label>
        <div id="currentFile" class="loading">Carregando...</div>
        
        <div class="file-actions">
          <label for="newFile">Substituir por novo arquivo:</label>
          <input type="file" id="newFile" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg">
          
          <div class="checkbox-container">
            <input type="checkbox" id="removeFile">
            <label for="removeFile">Remover arquivo atual</label>
          </div>
        </div>
      </div>
      
      <div class="buttons">
        <button type="submit">Salvar Alterações</button>
        <button type="button" id="cancelBtn">Cancelar</button>
      </div>
      
      <div id="message"></div>
    </form>
  </div>

  <script>
    let usuario;

    async function fetchWithAuth(url, options = {}) {
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'login.html';
            return;
        }

        const headers = {
            ...options.headers,
        };

        if (!(options.body instanceof FormData)) {
            headers['Content-Type'] = 'application/json';
        }
        headers['x-auth-token'] = token;


        const response = await fetch(url, { ...options, headers });

        if (response.status === 401 || response.status === 403) {
            window.location.href = 'login.html';
            return;
        }

        return response;
    }

    async function getUsuario() {
        const response = await fetchWithAuth('/api/auth');
        if(response) {
            usuario = await response.json();
            if (usuario.role !== 'admin' && usuario.role !== 'funcionario') {
                document.getElementById('editForm').style.display = 'none';
                // Se for empresário, pode ver os detalhes, mas não editar
                if (usuario.role === 'empresario') {
                    window.location.href = `detalhes-empresa.html?id=${empresaId}`; // Redireciona para detalhes
                }
                showMessage('Você não tem permissão para editar empresas.', 'error');
            }
        }
    }

    const urlParams = new URLSearchParams(window.location.search);
    const empresaId = urlParams.get('id');
    document.getElementById('empresaId').value = empresaId;

    async function loadEmpresa() {
      try {
        showMessage('Carregando dados da empresa...', 'loading');
        
        const response = await fetchWithAuth(`/api/empresas/${empresaId}`);
        
        if(response) {
            if (!response.ok) {
              const errorData = await response.json();
              throw new Error(errorData.message || 'Erro ao carregar empresa');
            }
            
            const data = await response.json();
            
            document.getElementById('cnpj').value = data.cnpj;
            document.getElementById('nome').value = data.nome;
            document.getElementById('email').value = data.email;
            
            const fileInfo = document.getElementById('currentFile');
            // A informação do arquivo vem do array 'certidoes'
            if (data.certidoes && data.certidoes.length > 0) {
              const arquivo = data.certidoes[0];
              fileInfo.innerHTML = `<p><strong>Arquivo atual:</strong> ${arquivo.nomeArquivo}</p>`;
            } else {
              fileInfo.innerHTML = '<p>Nenhum arquivo cadastrado</p>';
            }
            
            clearMessage();
        }
        
      } catch (error) {
        console.error('Erro ao carregar empresa:', error);
        showMessage(`Erro ao carregar dados: ${error.message}`, 'error');
      }
    }

    document.getElementById('editForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      showMessage('Salvando alterações...', 'loading');
      
      try {
        const formData = new FormData();
        formData.append('nome', document.getElementById('nome').value);
        formData.append('cnpj', document.getElementById('cnpj').value);
        formData.append('email', document.getElementById('email').value);
        
        if (document.getElementById('removeFile').checked) {
          formData.append('removerArquivo', 'true');
        }
        
        const newFile = document.getElementById('newFile').files[0];
        if (newFile) {
          formData.append('arquivo', newFile);
        }

        const response = await fetchWithAuth(`/api/empresas/${empresaId}`, {
          method: 'PUT',
          body: formData
        });

        if(response) {
            const result = await response.json();
            
            if (!response.ok) {
              throw new Error(result.message || 'Erro ao atualizar empresa');
            }
    
            showMessage('Empresa atualizada com sucesso!', 'success');
            
            await loadEmpresa();
            
            document.getElementById('newFile').value = '';
            document.getElementById('removeFile').checked = false;
        }
        
      } catch (error) {
        console.error('Erro ao atualizar empresa:', error);
        showMessage(`Erro: ${error.message}`, 'error');
      }
    });

    function showMessage(text, type) {
      const messageEl = document.getElementById('message');
      messageEl.textContent = text;
      messageEl.className = `message ${type}`;
    }

    function clearMessage() {
      const messageEl = document.getElementById('message');
      messageEl.textContent = '';
      messageEl.className = 'message';
    }

    document.getElementById('cancelBtn').addEventListener('click', function() {
      window.location.href = 'empresas.html';
    });

  </script>
</body>
</html>
