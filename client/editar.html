<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ADCON - Editar Empresa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/pages/editar.css">
</head>
<body style="display: none;">
    <script>
        if (!localStorage.getItem('token')) window.location.replace('login.html');
        else document.body.style.display = 'block';
    </script>
    <script src="shared.js"></script>
    <div id="header-placeholder"></div>

    <div class="container">
        <h1>Editar Empresa</h1>
        <form id="formulario-empresa">
            <!-- DADOS DA EMPRESA -->
            <button type="button" class="accordion-header">Dados da Empresa</button>
            <div class="accordion-content">
                <div class="form-grid">
                    <div class="form-group form-group-full">
                        <label>Tipo de Empresa</label>
                        <div class="radio-group">
                            <input type="radio" id="tipo_matriz" name="tipo" value="matriz" checked> <label for="tipo_matriz">Matriz</label>
                            <input type="radio" id="tipo_filial" name="tipo" value="filial"> <label for="tipo_filial">Filial</label>
                        </div>
                    </div>
                    <!-- Seção para vincular à Matriz -->
                    <div id="matriz-fields-container" style="display: none; grid-column: 1 / -1;">
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="matriz_cnpj">CNPJ da Matriz (Opcional)</label>
                                <input type="text" id="matriz_cnpj" name="matriz_cnpj" placeholder="Digite o CNPJ da matriz">
                                <button type="button" id="btn-buscar-matriz" style="margin-top: 0.5rem; width: auto; padding: 0.5rem 1rem;">Buscar Matriz</button>
                            </div>
                            <div class="form-group">
                                <label for="matriz_nome">Nome da Matriz</label>
                                <input type="text" id="matriz_nome" name="matriz_nome" readonly style="background-color: #e9ecef;">
                            </div>
                            <!-- Campo oculto para armazenar o ID da matriz -->
                            <input type="hidden" id="matriz_id" name="matriz_id">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="cnpj">CNPJ</label>
                        <input type="text" id="cnpj" name="cnpj" placeholder="00.000.000/0000-00" required>
                    </div>
                    <div class="form-group">
                        <label for="inscricao_estadual">Inscrição Estadual (Opcional)</label>
                        <input type="text" id="inscricao_estadual" name="inscricao_estadual" placeholder="Número da Inscrição Estadual">
                    </div>
                    <div class="form-group">
                        <label for="data_abertura">Data de Abertura</label>
                        <input type="date" id="data_abertura" name="data_abertura" required>
                    </div>
                    <div class="form-group form-group-full">
                        <label for="nome_empresarial">Nome Empresarial</label>
                        <input type="text" id="nome_empresarial" name="nome_empresarial" required>
                    </div>
                    <div class="form-group form-group-full">
                        <label for="nome_fantasia">Nome Fantasia (Opcional)</label>
                        <input type="text" id="nome_fantasia" name="nome_fantasia">
                    </div>
                    <div class="form-group">
                        <label for="nire">NIRE</label>
                        <input type="text" id="nire" name="nire">
                    </div>
                    <div class="form-group">
                        <label for="capital_social">Capital Social</label>
                        <input type="text" id="capital_social" name="capital_social" placeholder="R$ 0,00" required>
                    </div>
                    <div class="form-group">
                        <label for="atividade_principal">Atividade Principal (CNAE)</label>
                        <input type="text" id="atividade_principal" name="atividade_principal" placeholder="00.00-0-00" required>
                    </div>
                    <div class="form-group form-group-full">
                        <label for="atividade_principal_descricao">Descrição da Atividade</label>
                        <input type="text" id="atividade_principal_descricao" name="atividade_principal_descricao" readonly style="background-color: #e9ecef;">
                    </div>
                    <div class="form-group">
                        <label>Porte</label>
                        <div class="radio-group" id="porte-group">
                            <div class="radio-item"><input type="radio" id="porte_mei" name="porte" value="MEI" required> <label for="porte_mei">MEI</label></div>
                            <div class="radio-item"><input type="radio" id="porte_me" name="porte" value="ME"> <label for="porte_me">ME</label></div>
                            <div class="radio-item"><input type="radio" id="porte_epp" name="porte" value="EPP"> <label for="porte_epp">EPP</label></div>
                            <div class="radio-item"><input type="radio" id="porte_outros" name="porte" value="Outros"> <label for="porte_outros">Outros</label></div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Natureza Jurídica</label>
                        <div class="radio-group" id="natureza-group">
                            <div class="radio-item"><input type="radio" id="natureza_individual" name="natureza_juridica" value="Individual" required> <label for="natureza_individual">Individual</label></div>
                            <div class="radio-item"><input type="radio" id="natureza_limitada" name="natureza_juridica" value="Limitada"> <label for="natureza_limitada">Limitada</label></div>
                            <div class="radio-item"><input type="radio" id="natureza_outros" name="natureza_juridica" value="Outros"> <label for="natureza_outros">Outros</label></div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Optante do Simples Nacional?</label>
                        <div class="radio-group">
                            <div class="radio-item"><input type="radio" id="simples_sim" name="simples_nacional" value="sim" required> <label for="simples_sim">Sim</label></div>
                            <div class="radio-item"><input type="radio" id="simples_nao" name="simples_nacional" value="nao"> <label for="simples_nao">Não</label></div>
                        </div>
                    </div>
                    <div class="form-group" id="possui-filial-group" style="display: none;">
                        <label>Possui Filial?</label>
                        <div class="radio-group">
                            <div class="radio-item"><input type="radio" id="possui_filial_sim" name="possui_filial" value="sim"> <label for="possui_filial_sim">Sim</label></div>
                            <div class="radio-item"><input type="radio" id="possui_filial_nao" name="possui_filial" value="nao"> <label for="possui_filial_nao">Não</label></div>
                        </div>
                    </div>
                </div>
            </div>

            <button type="button" class="accordion-header">Endereço e Contato</button>
            <div class="accordion-content">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="cep">CEP</label>
                        <input type="text" id="cep" name="endereco.cep" placeholder="00000-000" required>
                    </div>
                    <div class="form-group form-group-full">
                        <label for="rua">Rua</label>
                        <input type="text" id="rua" name="endereco.rua" required>
                    </div>
                    <div class="form-group">
                        <label for="numero">Número</label>
                        <input type="text" id="numero" name="endereco.numero" required>
                    </div>
                    <div class="form-group">
                        <label for="complemento">Complemento (Opcional)</label>
                        <input type="text" id="complemento" name="endereco.complemento">
                    </div>
                    <div class="form-group">
                        <label for="bairro">Bairro</label>
                        <input type="text" id="bairro" name="endereco.bairro" required>
                    </div>
                    <div class="form-group">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" name="endereco.cidade" required>
                    </div>
                    <div class="form-group">
                        <label for="estado">Estado</label>
                        <input type="text" id="estado" name="endereco.estado" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email">
                    </div>
                    <div class="form-group">
                        <label for="telefone">Telefone</label>
                        <input type="text" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
                    </div>
                </div>
            </div>

            <button type="button" class="accordion-header">Quadro Societário</button>
            <div class="accordion-content">
                <div id="socios-container"></div>
                <button type="button" class="btn-add">+ Adicionar Sócio</button>
            </div>

            <button type="button" class="accordion-header">Documentos</button>
            <div class="accordion-content">
                <div style="padding: 1rem 0.5rem;">
                    <!-- Cartão CNPJ -->
                    <div class="form-group form-group-full" style="border-bottom: 1px solid #eee; padding-bottom: 1rem; margin-bottom: 1rem;">
                        <label for="arquivo_cnpj">Cartão CNPJ</label>
                        <div id="info_arquivo_cnpj" class="file-info"></div>
                        <input type="hidden" name="remover_arquivo_cnpj" value="false">
                        <input type="file" id="arquivo_cnpj" name="arquivo_cnpj" accept=".pdf,.png,.jpg,.jpeg">
                    </div>

                    <!-- Certificado Digital -->
                    <div class="form-grid" style="align-items: end; border-bottom: 1px solid #eee; padding-bottom: 1rem; margin-bottom: 1rem;">
                        <div class="form-group">
                            <label for="certificado_digital">Certificado Digital</label>
                            <div id="info_certificado_digital" class="file-info"></div>
                            <input type="hidden" name="remover_certificado_digital" value="false">
                            <input type="file" id="certificado_digital" name="certificado_digital" accept=".pfx,.p12">
                        </div>
                        <div class="form-group">
                            <label for="certificado_validade">Validade do Certificado</label>
                            <input type="date" id="certificado_validade" name="certificado_validade">
                        </div>
                        <div class="form-group">
                            <label for="certificado_senha">Senha do Certificado</label>
                            <input type="password" id="certificado_senha" name="certificado_senha" placeholder="Preencha para alterar">
                        </div>
                    </div>

                    <!-- Alvará -->
                    <div class="form-grid" style="align-items: end; border-bottom: 1px solid #eee; padding-bottom: 1rem; margin-bottom: 1rem;">
                        <div class="form-group">
                            <label for="alvara_arquivo">Alvará</label>
                            <div id="info_alvara_arquivo" class="file-info"></div>
                            <input type="hidden" name="remover_alvara_arquivo" value="false">
                            <input type="file" id="alvara_arquivo" name="alvara_arquivo">
                        </div>
                        <div class="form-group">
                            <label for="alvara_ano">Ano do Alvará</label>
                            <input type="text" id="alvara_ano" name="alvara_ano" placeholder="Ex: 2025">
                        </div>
                    </div>

                    <!-- Certidão Prefeitura -->
                    <div class="form-grid" style="align-items: end; border-bottom: 1px solid #eee; padding-bottom: 1rem; margin-bottom: 1rem;">
                        <div class="form-group">
                            <label for="certidao_prefeitura_arquivo">Certidão Prefeitura</label>
                            <div id="info_certidao_prefeitura_arquivo" class="file-info"></div>
                            <input type="hidden" name="remover_certidao_prefeitura_arquivo" value="false">
                            <input type="file" id="certidao_prefeitura_arquivo" name="certidao_prefeitura_arquivo">
                        </div>
                        <div class="form-group">
                            <label for="certidao_prefeitura_validade">Validade</label>
                            <input type="date" id="certidao_prefeitura_validade" name="certidao_prefeitura_validade">
                        </div>
                    </div>

                    <!-- Certidão Receita Federal -->
                    <div class="form-grid" style="align-items: end; border-bottom: 1px solid #eee; padding-bottom: 1rem; margin-bottom: 1rem;">
                        <div class="form-group">
                            <label for="certidao_receita_arquivo">Certidão Receita Federal</label>
                            <div id="info_certidao_receita_arquivo" class="file-info"></div>
                            <input type="hidden" name="remover_certidao_receita_arquivo" value="false">
                            <input type="file" id="certidao_receita_arquivo" name="certidao_receita_arquivo">
                        </div>
                        <div class="form-group">
                            <label for="certidao_receita_validade">Validade</label>
                            <input type="date" id="certidao_receita_validade" name="certidao_receita_validade">
                        </div>
                    </div>

                    <!-- Certidão FGTS -->
                    <div class="form-grid" style="align-items: end; border-bottom: 1px solid #eee; padding-bottom: 1rem; margin-bottom: 1rem;">
                        <div class="form-group">
                            <label for="certidao_fgts_arquivo">Certidão FGTS</label>
                            <div id="info_certidao_fgts_arquivo" class="file-info"></div>
                            <input type="hidden" name="remover_certidao_fgts_arquivo" value="false">
                            <input type="file" id="certidao_fgts_arquivo" name="certidao_fgts_arquivo">
                        </div>
                        <div class="form-group">
                            <label for="certidao_fgts_validade">Validade</label>
                            <input type="date" id="certidao_fgts_validade" name="certidao_fgts_validade">
                        </div>
                    </div>

                    <!-- Certidão Trabalhista -->
                    <div class="form-grid" style="align-items: end; border-bottom: 1px solid #eee; padding-bottom: 1rem; margin-bottom: 1rem;">
                        <div class="form-group">
                            <label for="certidao_trabalhista_arquivo">Certidão Trabalhista</label>
                            <div id="info_certidao_trabalhista_arquivo" class="file-info"></div>
                            <input type="hidden" name="remover_certidao_trabalhista_arquivo" value="false">
                            <input type="file" id="certidao_trabalhista_arquivo" name="certidao_trabalhista_arquivo">
                        </div>
                        <div class="form-group">
                            <label for="certidao_trabalhista_validade">Validade</label>
                            <input type="date" id="certidao_trabalhista_validade" name="certidao_trabalhista_validade">
                        </div>
                    </div>

                    <!-- Certidão de Falência -->
                    <div class="form-grid" style="align-items: end; border-bottom: 1px solid #eee; padding-bottom: 1rem; margin-bottom: 1rem;">
                        <div class="form-group">
                            <label for="certidao_falencia_arquivo">Certidão de Falência</label>
                            <div id="info_certidao_falencia_arquivo" class="file-info"></div>
                            <input type="hidden" name="remover_certidao_falencia_arquivo" value="false">
                            <input type="file" id="certidao_falencia_arquivo" name="certidao_falencia_arquivo">
                        </div>
                        <div class="form-group">
                            <label for="certidao_falencia_validade">Validade</label>
                            <input type="date" id="certidao_falencia_validade" name="certidao_falencia_validade">
                        </div>
                    </div>

                    <!-- Inscrição Estadual -->
                    <div class="form-grid" style="align-items: end; border-bottom: 1px solid #eee; padding-bottom: 1rem; margin-bottom: 1rem;">
                        <div class="form-group">
                            <label for="inscricao_estadual_arquivo">Inscrição Estadual</label>
                            <div id="info_inscricao_estadual_arquivo" class="file-info"></div>
                            <input type="hidden" name="remover_inscricao_estadual_arquivo" value="false">
                            <input type="file" id="inscricao_estadual_arquivo" name="inscricao_estadual_arquivo">
                        </div>
                        <div class="form-group">
                            <label for="inscricao_estadual_validade">Validade</label>
                            <input type="date" id="inscricao_estadual_validade" name="inscricao_estadual_validade">
                        </div>
                    </div>

                    <!-- Certidão SEFAZ -->
                    <div class="form-grid" style="align-items: end;">
                        <div class="form-group">
                            <label for="certidao_sefaz_arquivo">Certidão da SEFAZ</label>
                            <div id="info_certidao_sefaz_arquivo" class="file-info"></div>
                            <input type="hidden" name="remover_certidao_sefaz_arquivo" value="false">
                            <input type="file" id="certidao_sefaz_arquivo" name="certidao_sefaz_arquivo">
                        </div>
                        <div class="form-group">
                            <label for="certidao_sefaz_validade">Validade</label>
                            <input type="date" id="certidao_sefaz_validade" name="certidao_sefaz_validade">
                        </div>
                    </div>
                </div>
            </div>

            <button type="button" class="accordion-header">Contrato Social</button>
            <div class="accordion-content">
                <div id="contratos-container"></div>
                <button type="button" class="btn-add">+ Adicionar Alteração Contratual</button>
            </div>

            <button type="button" class="accordion-header">Balanços Patrimoniais</button>
            <div class="accordion-content">
                <p style="color: #6c757d; font-size: 0.9rem; margin-bottom: 1rem;">Os balanços patrimoniais são documentos anuais. Adicione os balanços de cada ano fiscal.</p>
                <div id="balancos-container"></div>
                <button type="button" class="btn-add" id="btn-add-balanco">+ Adicionar Balanço Patrimonial</button>
            </div>

            <button type="button" class="accordion-header">Documentos Diversos</button>
            <div class="accordion-content">
                <p style="color: #6c757d; font-size: 0.9rem; margin-bottom: 1rem;">Adicione outros documentos relevantes. Informe o nome do documento e, se aplicável, a data de validade para receber avisos de vencimento.</p>
                <div id="diversos-container"></div>
                <button type="button" class="btn-add" id="btn-add-diverso">+ Adicionar Documento</button>
            </div>

            <!-- NAVEGAÇÃO E SUBMISSÃO -->
            <div class="navigation-buttons" style="margin-top: 2rem;">
                <button type="button" class="btn-secondary">Cancelar</button>
                <button type="submit" id="submitBtn">Salvar Alterações</button>
            </div>
        </form>
        <div id="message" style="display: none;"></div>
    </div>

    <!-- Template para o card de sócio -->
    <template id="socio-template">
        <div class="socio-card">
            <button type="button" class="btn-remover" style="float: right;">Remover Sócio</button>
            <h3>Dados do Sócio</h3>
            <div class="form-grid">
                <div class="form-group form-group-full">
                    <label>Nome Completo</label>
                    <input type="text" name="socios[INDEX][nome]" required>
                </div>
                <div class="form-group">
                    <label>CPF</label>
                    <input type="text" name="socios[INDEX][cpf]" placeholder="000.000.000-00" required>
                </div>
                <div class="form-group">
                    <label>RG</label>
                    <input type="text" name="socios[INDEX][rg]" required>
                </div>
                <div class="form-group">
                    <label>Órgão Emissor</label>
                    <input type="text" name="socios[INDEX][orgao_emissor]" placeholder="Ex: SSP" required>
                </div>
                <div class="form-group">
                    <label>UF Emissor</label>
                    <input type="text" name="socios[INDEX][estado_emissor]" placeholder="Ex: SP" maxlength="2" required>
                </div>
                <div class="form-group">
                    <label>Data de Nascimento</label>
                    <input type="date" name="socios[INDEX][data_nascimento]" required>
                </div>
                <div class="form-group">
                    <label>Gênero</label>
                    <select name="socios[INDEX][genero]" required>
                        <option value="masculino">Masculino</option>
                        <option value="feminino">Feminino</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="label-socio-tipo">Tipo</label>
                    <select name="socios[INDEX][is_admin]" class="select-socio-tipo" required>
                        <option value="nao">Sócio</option>
                        <option value="sim">Sócio Administrador</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Estado Civil</label>
                    <select name="socios[INDEX][estado_civil]" required>
                        <option value="solteiro">Solteiro(a)</option>
                        <option value="casado">Casado(a)</option>
                        <option value="uniao_estavel">União Estável</option>
                        <option value="divorciado">Divorciado(a)</option>
                        <option value="viuvo">Viúvo(a)</option>
                    </select>
                </div>
                <div class="form-group" style="display: none;">
                    <label>Regime de Casamento</label>
                    <select name="socios[INDEX][regime_casamento]">
                        <option value="comunhao_parcial">Comunhão Parcial de Bens</option>
                        <option value="comunhao_universal">Comunhão Universal de Bens</option>
                        <option value="separacao_total">Separação Total de Bens</option>
                        <option value="participacao_final">Participação Final nos Aquestos</option>
                    </select>
                </div>
            </div>
            <h4>Endereço do Sócio</h4>
            <div class="form-grid">
                 <div class="form-group">
                    <label>CEP</label>
                    <input type="text" name="socios[INDEX][endereco][cep]" placeholder="00000-000" onblur="buscarCepSocio(this)" required>
                </div>
                <div class="form-group form-group-full">
                    <label>Rua</label>
                    <input type="text" name="socios[INDEX][endereco][rua]" required>
                </div>
                <div class="form-group">
                    <label>Número</label>
                    <input type="text" name="socios[INDEX][endereco][numero]" required>
                </div>
                <div class="form-group">
                    <label>Complemento (Opcional)</label>
                    <input type="text" name="socios[INDEX][endereco][complemento]">
                </div>
                <div class="form-group">
                    <label>Bairro</label>
                    <input type="text" name="socios[INDEX][endereco][bairro]" required>
                </div>
                <div class="form-group">
                    <label>Cidade</label>
                    <input type="text" name="socios[INDEX][endereco][cidade]" required>
                </div>
                <div class="form-group">
                    <label>Estado</label>
                    <input type="text" name="socios[INDEX][endereco][estado]" required>
                </div>
            </div>
        </div>
    </template>

    <!-- Template para alteração de contrato -->
    <template id="contrato-template">
        <div class="alteracao-card">
            <button type="button" class="btn-remover" style="float: right;">Remover</button>
            <h3>Alteração Contratual</h3>
            <div class="form-grid" style="align-items: end;">
                <div class="form-group">
                    <label>Arquivo da Alteração</label>
                    <div class="file-info"></div>
                    <input type="file" name="contrato_social[INDEX][arquivo]" accept=".pdf">
                </div>
                <div class="form-group">
                    <label>Data da Alteração</label>
                    <input type="date" name="contrato_social[INDEX][data]" required>
                </div>
            </div>
        </div>
    </template>

    <!-- Template para balanço patrimonial -->
    <template id="balanco-template">
        <div class="alteracao-card">
            <button type="button" class="btn-remover" style="float: right;">Remover</button>
            <h3>Balanço Patrimonial</h3>
            <div class="form-grid" style="align-items: end;">
                <div class="form-group">
                    <label>Arquivo do Balanço (PDF)</label>
                    <div class="file-info"></div>
                    <input type="file" name="balanco_patrimonial[INDEX][arquivo]" accept=".pdf">
                </div>
                <div class="form-group">
                    <label>Ano do Balanço</label>
                    <input type="text" name="balanco_patrimonial[INDEX][ano]" placeholder="Ex: 2024" maxlength="4" required>
                </div>
            </div>
        </div>
    </template>

    <!-- Template para documento diverso -->
    <template id="diverso-template">
        <div class="alteracao-card">
            <button type="button" class="btn-remover" style="float: right;">Remover</button>
            <h3>Documento Diverso</h3>
            <div class="form-grid" style="align-items: end;">
                <div class="form-group">
                    <label>Nome do Documento *</label>
                    <input type="text" name="documento_diverso[INDEX][nome]" placeholder="Ex: Procuração, Ata de Reunião, etc." required>
                </div>
                <div class="form-group">
                    <label>Arquivo (PDF) *</label>
                    <div class="file-info"></div>
                    <input type="file" name="documento_diverso[INDEX][arquivo]" accept=".pdf" required>
                </div>
                <div class="form-group">
                    <label>Data de Validade (Opcional)</label>
                    <input type="date" name="documento_diverso[INDEX][validade]" placeholder="Deixe em branco se não houver">
                </div>
            </div>
        </div>
    </template>

    <script src="js/pages/editar.js"></script>
</body>
</html>
