<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ADCON - Notificações</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/pages/notificacoes.css">
</head>
<body style="display: none;">
    <script>
        if (!localStorage.getItem('token')) window.location.replace('login.html');
    </script>
    
    <div id="header-placeholder"></div>

    <div class="container">
        <h1 class="page-title">🔔 Central de Notificações</h1>

        <div class="notification-filters">
            <select id="filterTipo">
                <option value="">Todos os tipos</option>
                <option value="documento_vencendo">Documentos vencendo</option>
                <option value="documento_vencido">Documentos vencidos</option>
                <option value="pagamento_recebido">Pagamentos</option>
                <option value="mensagem_admin">Mensagens do Admin</option>
                <option value="sistema">Sistema</option>
            </select>
            
            <select id="filterLida">
                <option value="">Todas</option>
                <option value="false">Não lidas</option>
                <option value="true">Lidas</option>
            </select>
            
            <button>Filtrar</button>
            <button class="secondary">Marcar todas como lidas</button>
            <button class="secondary">Limpar lidas</button>
        </div>

        <div id="notificationContainer">
            <div class="loading">Carregando notificações...</div>
        </div>
    </div>

    <script src="shared.js"></script>
    <script src="js/pages/notificacoes.js"></script>
</body>
</html>
