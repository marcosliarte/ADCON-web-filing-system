<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funcionários e Pagamentos - ADCON</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="header-placeholder"></div>

    <div class="container">
        <h2>Gestão de Funcionários</h2>

        <!-- Formulário de Cadastro -->
        <div class="card">
            <h3>Cadastrar Novo Funcionário</h3>
            <form id="form-novo-funcionario">
                <input type="hidden" id="funcionarioId" name="funcionarioId">
                <div class="form-group">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" required>
                </div>
                <div class="form-group">
                    <label for="cargo">Cargo:</label>
                    <input type="text" id="cargo" name="cargo" required>
                </div>
                <div class="form-group">
                    <label for="salarioBruto">Salário Bruto (R$):</label>
                    <input type="number" id="salarioBruto" name="salarioBruto" step="0.01" required>
                </div>

                <!-- Seção de Descontos Dinâmicos -->
                <div class="form-group-full">
                    <label>Descontos Mensais Fixos:</label>
                    <div id="descontos-container">
                    <!-- Exemplo de desconto inicial (opcional, pode ser removido se preferir começar vazio) -->
                    <!-- <div class="desconto-item">
                        <input type="text" name="desconto-descricao" placeholder="Descrição (ex: Vale Transporte)" required><input type="number" name="desconto-valor" placeholder="Valor (R$)" step="0.01" required><input type="number" name="desconto-mes-inicio" placeholder="Mês Início (opc)" min="1" max="12"><input type="number" name="desconto-ano-inicio" placeholder="Ano Início (opc)"><input type="number" name="desconto-duracao" placeholder="Duração (meses, -1 p/ sempre)" min="-1"><button type="button" class="btn-remover btn-sm">Remover</button>
                    </div> -->
                        <!-- Campos de desconto serão adicionados aqui via JS -->
                    </div>
                    <button type="button" id="btn-add-desconto" class="btn-secondary" style="margin-top: 0.5rem;">+ Adicionar Desconto</button>
                </div>

                <div class="action-buttons">
                    <button type="submit" id="btn-salvar-funcionario" class="btn">Cadastrar</button>
                    <button type="button" id="btn-cancelar-edicao" class="btn-secondary" style="display: none;">Cancelar Edição</button>
                </div>
            </form>
        </div>

        <!-- Lista de Funcionários -->
        <div class="card">
            <h3>Funcionários Cadastrados</h3>
            <table id="tabela-funcionarios">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Cargo</th>
                        <th>Salário Bruto</th>
                        <th>Descontos Fixos</th>
                        <th>Status (Mês Atual)</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Linhas de funcionários serão inseridas aqui via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal para Detalhes de Pagamento -->
    <div id="modal-pagamento" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h3 id="modal-titulo-pagamento">Demonstrativo de Pagamento</h3>
            <div class="demonstrativo-container">
                <div class="demonstrativo-header">
                    <p><strong>Funcionário:</strong> <span id="modal-nome-funcionario"></span></p>
                    <div class="periodo-selector">
                        <label for="mes-pagamento">Mês:</label>
                        <select id="mes-pagamento"></select>
                        <label for="ano-pagamento">Ano:</label>
                        <input type="number" id="ano-pagamento" min="2020" max="2050">
                        <button id="btn-gerar-demonstrativo" class="btn-sm">Gerar Demonstrativo</button>
                    </div>
                </div>
                <hr>
                <div id="demonstrativo-corpo">
                    <!-- O demonstrativo será gerado aqui -->
                </div>
                <div id="demonstrativo-historico" style="margin-top: 2rem;">
                    <h4>Histórico de Pagamentos</h4>
                    <ul id="lista-historico-pagamentos">
                        <!-- Histórico será preenchido aqui -->
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="shared.js"></script>
    <script src="funcionarios-pagamentos.js"></script>

</body>
</html>
