<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funcionários e Pagamentos - ADCON</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* --- CORREÇÃO DE DESIGN: Estilos para o Modal --- */
        .modal {
            display: none; /* Oculto por padrão */
            position: fixed; /* Fica sobre todo o conteúdo */
            z-index: 1001; /* Garante que fique na frente */
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto; /* Permite rolagem se o conteúdo for grande */
            background-color: rgba(0,0,0,0.6); /* Fundo escurecido */
            padding-top: 60px; /* Espaço no topo */
        }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>

    <div class="container">
        <h2>Gestão de Funcionários</h2>

        <!-- Formulário de Cadastro/Edição -->
        <div class="card">
            <h3>Cadastrar Novo Funcionário</h3>
            <form id="form-novo-funcionario">
                <input type="hidden" id="funcionarioId">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="nome">Nome Completo:</label>
                        <input type="text" id="nome" required>
                    </div>
                    <div class="form-group">
                        <label for="cargo">Cargo:</label>
                        <input type="text" id="cargo" required>
                    </div>
                    <div class="form-group">
                        <label for="salarioBruto">Salário Bruto (R$):</label>
                        <input type="number" id="salarioBruto" step="0.01" required>
                    </div>
                </div>
                <div class="form-group-full" style="margin-top: 1.5rem;">
                    <label>Descontos Fixos Recorrentes:</label>
                    <div id="descontos-container"></div>
                    <button type="button" id="btn-add-desconto" class="btn-secondary" style="margin-top: 0.5rem;">+ Adicionar Desconto</button>
                </div>
                <div class="action-buttons">
                    <button type="submit" id="btn-salvar-funcionario" class="btn">Cadastrar</button>
                    <button type="button" id="btn-cancelar-edicao" class="btn-secondary" style="display: none;">Cancelar Edição</button>
                </div>
            </form>
        </div>

        <!-- Lista de Funcionários -->
        <div class="card">
            <h3>Funcionários Cadastrados</h3>
            <table id="tabela-funcionarios">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Cargo</th>
                        <th>Salário Bruto</th>
                        <th>Status (Mês Atual)</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Linhas de funcionários serão inseridas aqui -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal para Demonstrativo de Pagamento -->
    <div id="modal-pagamento" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h3 id="modal-titulo-pagamento">Demonstrativo de Pagamento</h3>
            <div class="demonstrativo-container">
                <div class="demonstrativo-header">
                    <p><strong>Funcionário:</strong> <span id="modal-nome-funcionario"></span></p>
                    <div class="periodo-selector">
                        <label for="mes-pagamento">Mês:</label>
                        <select id="mes-pagamento"></select>
                        <label for="ano-pagamento">Ano:</label>
                        <input type="number" id="ano-pagamento" min="2020" max="2050">
                        <button id="btn-gerar-demonstrativo" class="btn-sm">Gerar Demonstrativo</button>
                    </div>
                </div>
                <div id="demonstrativo-corpo"></div>
                <div id="demonstrativo-historico" style="margin-top: 2rem;">
                    <h4>Histórico de Pagamentos</h4>
                    <ul id="lista-historico-pagamentos"></ul>
                </div>
            </div>
        </div>
    </div>

    <script src="shared.js"></script>
    <script src="funcionarios-pagamentos.js"></script>

</body>
</html>
