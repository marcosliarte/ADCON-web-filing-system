<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funcionários e Pagamentos - ADCON</title>
    <script src="shared.js"></script>
    <link rel="stylesheet" href="css/pages/funcionarios-pagamentos.css">
</head>
<body style="display: none;">
    <script>
        if (localStorage.getItem('token')) {
            document.body.style.display = 'block';
        } else {
            window.location.replace('login.html');
        }
    </script>

    <div id="header-placeholder"></div>

    <div class="container">
        <a href="home.html" class="back-btn">← Voltar</a>
        <h2>Gestão de Funcionários</h2>

        <!-- Formulário de Cadastro/Edição -->
        <div class="card">
            <h3>Cadastrar Novo Funcionário</h3>
            <form id="form-novo-funcionario">
                <input type="hidden" id="funcionarioId">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="nome">Nome Completo:</label>
                        <input type="text" id="nome" required>
                    </div>
                    <div class="form-group">
                        <label for="cargo">Cargo:</label>
                        <input type="text" id="cargo" required>
                    </div>
                    <div class="form-group">
                        <label for="salarioBruto">Salário Bruto (R$):</label>
                        <input type="number" id="salarioBruto" step="0.01" required>
                    </div>
                    <div class="form-group" id="group-chave-pix">
                        <label for="chavePix">Chave Pix:</label>
                        <input type="text" id="chavePix" placeholder="CPF, e-mail, telefone, etc.">
                    </div>
                    <!-- CAMPO ADICIONADO PARA VINCULAR USUÁRIO -->
                    <div class="form-group" id="group-vincular-usuario">
                        <label for="usuario-vinculado">Vincular ao Usuário do Sistema</label>
                        <select id="usuario-vinculado" required>
                            <option value="">Carregando usuários...</option>
                        </select>
                    </div>
                </div>
                <div class="form-group-full">
                    <label>Descontos Fixos Recorrentes:</label>
                    <div id="descontos-container"></div>
                    <button type="button" id="btn-add-desconto" class="btn-secondary">+ Adicionar Desconto</button>
                </div>
                <div class="action-buttons">
                    <button type="submit" id="btn-salvar-funcionario" class="btn">Cadastrar</button>
                    <button type="button" id="btn-cancelar-edicao" class="btn-secondary hidden">Cancelar Edição</button>
                </div>
            </form>
        </div>

        <!-- Lista de Funcionários -->
        <div class="card">
            <h3>Funcionários Cadastrados</h3>
            <table id="tabela-funcionarios">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Cargo</th>
                        <th>Salário Bruto</th>
                        <th>Chave Pix</th> <!-- Coluna já existe, apenas confirmando -->
                        <th>Status (Mês Atual)</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Linhas de funcionários serão inseridas aqui -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal para Demonstrativo de Pagamento -->
    <div id="modal-pagamento" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h3 id="modal-titulo-pagamento">Demonstrativo de Pagamento</h3>
            <div class="demonstrativo-container">
                <div class="demonstrativo-header">
                    <p><strong>Funcionário:</strong> <span id="modal-nome-funcionario"></span></p>
                    <div class="periodo-selector">
                        <label for="mes-pagamento">Mês:</label>
                        <select id="mes-pagamento"></select>
                        <label for="ano-pagamento">Ano:</label>
                        <input type="number" id="ano-pagamento" min="2020" max="2050">
                        <button id="btn-gerar-demonstrativo" class="btn-sm">Gerar Demonstrativo</button>
                    </div>
                </div>
                <div id="demonstrativo-corpo"></div>
                <div id="demonstrativo-historico">
                    <h4>Histórico de Pagamentos</h4>
                    <ul id="lista-historico-pagamentos"></ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Template para um único campo de desconto -->
    <template id="discount-template">
        <div class="discount-item">
            <div class="form-group">
                <label for="desconto-descricao-INDEX">Descrição:</label>
                <input type="text" id="desconto-descricao-INDEX" name="descontos[INDEX][descricao]" required>
            </div>
            <div class="form-group">
                <label for="desconto-valor-INDEX">Valor (R$):</label>
                <input type="number" id="desconto-valor-INDEX" name="descontos[INDEX][valor]" step="0.01" required>
            </div>
            <button type="button" class="btn-remove" onclick="removeDiscountField(this)">Remover</button>
        </div>
    </template>

    <script src="js/pages/funcionarios-pagamentos.js"></script>

    <script>
        // Variável para manter um índice único para cada desconto adicionado
        let discountIndex = 0;

        /**
         * Adiciona um novo campo de desconto ao formulário.
         * @param {object} [initialData={}] - Dados iniciais para preencher o campo (opcional).
         * @param {string} initialData.descricao - Descrição do desconto.
         * @param {number} initialData.valor - Valor do desconto.
         */
        function addDiscountField(initialData = {}) {
            const template = document.getElementById('discount-template');
            const clone = template.content.cloneNode(true);
            
            // Atualiza IDs e nomes para garantir unicidade no formulário
            const htmlContent = clone.innerHTML.replace(/INDEX/g, discountIndex);
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = htmlContent;

            const container = document.getElementById('descontos-container');
            container.appendChild(tempDiv.firstElementChild); // Adiciona o elemento raiz do template

            // Preenche com dados iniciais se fornecidos (útil para edição)
            if (initialData.descricao) {
                document.getElementById(`desconto-descricao-${discountIndex}`).value = initialData.descricao;
            }
            if (initialData.valor) {
                document.getElementById(`desconto-valor-${discountIndex}`).value = initialData.valor;
            }

            discountIndex++;
        }

        /**
         * Remove o campo de desconto pai do botão clicado.
         * @param {HTMLElement} button - O botão "Remover" clicado.
         */
        function removeDiscountField(button) {
            button.closest('.discount-item').remove();
        }

        // Adiciona um campo de desconto inicial ao carregar a página
        // e configura o listener para o botão "Adicionar Desconto".
        document.addEventListener('DOMContentLoaded', () => {
            addDiscountField(); // Adiciona um campo por padrão
            document.getElementById('btn-add-desconto').addEventListener('click', () => addDiscountField());
        });
    </script>
</body>
</html>
