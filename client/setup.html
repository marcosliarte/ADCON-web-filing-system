<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuração Inicial - ADCON</title>
    <link rel="stylesheet" href="css/global.css?v=2">
    <link rel="stylesheet" href="css/login.css?v=2">
    <style>
        .setup-badge {
            display: inline-block;
            background: #EFF6FF;
            color: #1D4ED8;
            border: 1px solid #BFDBFE;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 0.2rem 0.75rem;
            margin-bottom: 0.75rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .setup-desc {
            font-size: 0.88rem;
            color: #64748B;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
        .input-pw-wrap {
            position: relative;
        }
        .input-pw-wrap input {
            padding-right: 2.6rem;
        }
        .login-container .btn-eye {
            position: absolute;
            right: 0.6rem;
            top: 50%;
            transform: translateY(-50%);
            background: none !important;
            border: none !important;
            color: #94A3B8 !important;
            width: auto !important;
            padding: 0 !important;
            margin: 0 !important;
            font-size: 1rem;
            cursor: pointer;
            line-height: 1;
        }
        .login-container .btn-eye:hover { color: #475569 !important; background: none !important; }
        .hint-error {
            font-size: 0.78rem;
            color: #DC2626;
            margin-top: 0.3rem;
            display: none;
        }
        .step-indicator {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-bottom: 1.5rem;
            font-size: 0.8rem;
            color: #94A3B8;
        }
        .step-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #CBD5E1;
        }
        .step-dot.active { background: #2563EB; }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>⚙️ ADCON</h1>

        <div class="step-indicator">
            <div class="step-dot active"></div>
            <div class="step-dot"></div>
            Configuração inicial do sistema
        </div>

        <span class="setup-badge">Primeiro acesso</span>
        <p class="setup-desc">
            Nenhum administrador foi encontrado. Crie a conta principal para começar a usar o sistema.
        </p>

        <form id="setup-form" autocomplete="off" novalidate>
            <div class="form-group">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome" class="form-control"
                       required placeholder="Seu nome completo" autocomplete="off">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" class="form-control"
                       required placeholder="seu@email.com" autocomplete="off">
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <div class="input-pw-wrap">
                    <input type="password" id="senha" name="senha" class="form-control"
                           required placeholder="Mínimo 6 caracteres" autocomplete="new-password">
                    <button type="button" class="btn-eye" data-target="senha">👁</button>
                </div>
            </div>
            <div class="form-group">
                <label for="confirmar">Confirmar senha</label>
                <div class="input-pw-wrap">
                    <input type="password" id="confirmar" name="confirmar" class="form-control"
                           required placeholder="Repita a senha" autocomplete="new-password">
                    <button type="button" class="btn-eye" data-target="confirmar">👁</button>
                </div>
                <span class="hint-error" id="pw-mismatch">As senhas não conferem.</span>
            </div>

            <button type="submit" class="btn btn-primary" id="btn-setup">
                Criar administrador e entrar
            </button>
        </form>

        <div id="setup-message"></div>

        <p class="login-footer">
            Esta página só está disponível no primeiro acesso.<br>
            <small>Após criar o admin, ela ficará bloqueada.</small>
        </p>
    </div>

    <script src="js/pages/setup.js"></script>
</body>
</html>
