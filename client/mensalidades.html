<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ADCON - Gerenciar Mensalidades</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/pages/mensalidades.css">
</head>
<body style="display: none;">
    <!-- Script de bloqueio de acesso e exibição de conteúdo -->
    <script>
        // Este script é executado antes de tudo. Se não houver token, redireciona.
        if (!localStorage.getItem('token')) {
            window.location.replace('login.html');
        }
    </script>
    <div id="header-placeholder"></div>

    <div class="container">
        <h1 class="page-title">Gerenciamento de Mensalidades</h1>

        <div class="filtros">
            <label for="filtro-mes">Mês:</label>
            <select id="filtro-mes"></select>
            <label for="filtro-ano">Ano:</label>
            <input type="number" id="filtro-ano" min="2020" max="2050">
            <button>Filtrar</button>
        </div>

        <div class="table-responsive">
        <table id="tabela-mensalidades">
            <thead>
                <tr>
                    <th>Empresa</th>
                    <th>CNPJ</th>
                    <th>Status</th>
                    <th>Valor</th>
                    <th>Data de Vencimento</th>
                    <th>Data de Pagamento</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="7">Carregando...</td></tr>
            </tbody>
        </table>
        </div>
    </div>

    <!-- Modal para Ações -->
    <div id="acao-modal" class="modal">
        <div class="modal-content" style="max-width: 95%; box-sizing: border-box;">
            <span class="close-btn">&times;</span>
            <h2 id="modal-titulo"></h2>
            <form id="modal-form" class="modal-form">
                <input type="hidden" id="modal-mensalidade-id">
                <input type="hidden" id="modal-empresa-id">
                <div class="form-group">
                    <label for="modal-valor">Valor (R$)</label>
                    <input type="number" id="modal-valor" step="0.01" required>
                </div>
                <div class="form-group" style="display: none;">
                    <label for="modal-data-vencimento">Data de Vencimento</label>
                    <input type="date" id="modal-data-vencimento">
                </div>
                <button type="submit" id="modal-submit-btn">Salvar</button>
            </form>
        </div>
    </div>

    <script src="shared.js"></script>
    <script src="js/pages/mensalidades.js"></script>
</body>
</html>
