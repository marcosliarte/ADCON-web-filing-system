<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ADCON - Relatórios Financeiros</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Estilos do cabeçalho (copiados de home.html para consistência) */
        .header { background-color: #007bff; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); }
        .header h1 { margin: 0; font-size: 1.5rem; }
        .dropdown { position: relative; display: inline-block; }
        .dropdown-toggle { background-color: transparent; border: none; color: white; padding: 0.5rem; font-size: 1rem; cursor: pointer; display: flex; align-items: center; }
        .dropdown-content { display: none; position: absolute; right: 0; background-color: white; min-width: 180px; box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2); z-index: 1; border-radius: 5px; overflow: hidden; }
        .dropdown-content a { color: #333a40; padding: 12px 16px; text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .dropdown-content a:hover { background-color: #f1f1f1; }
        .show { display: block; }

        /* Estilos da página */
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background-color: #f4f7f6; color: #333; }
        .container { max-width: 1200px; margin: 2rem auto; background-color: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
        h1, h2 { color: #007bff; border-bottom: 2px solid #007bff; padding-bottom: 0.5rem; margin-bottom: 1.5rem; }
        .filters { display: flex; gap: 1rem; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; }
        .filters select, .filters input, .filters button { padding: 0.6rem; border: 1px solid #ccc; border-radius: 5px; font-size: 1rem; }
        button { background-color: #007bff; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 5px; cursor: pointer; transition: background-color 0.2s ease; }
        button:hover { background-color: #0056b3; }
        .report-section { display: none; margin-top: 2rem; }
        .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .summary-card { background-color: #f8f9fa; padding: 1.5rem; border-radius: 8px; text-align: center; border-left: 5px solid #007bff; }
        .summary-card h3 { margin-top: 0; color: #555; font-size: 1rem; }
        .summary-card p { font-size: 1.8rem; font-weight: bold; color: #007bff; margin: 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 1em; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #e9ecef; }
        .loading, .error { text-align: center; padding: 2rem; font-size: 1.2rem; font-style: italic; }
        .error { color: #dc3545; }
    </style>
</head>
<body style="display: none;">
    <!-- Script de bloqueio de acesso -->
    <script>
        if (localStorage.getItem('token')) {
            document.body.style.display = 'block';
        } else {
            window.location.replace('login.html');
        }
    </script>

    <div id="header-placeholder"></div>

    <div class="container">
        <h1>Relatórios Financeiros</h1>

        <!-- Filtros -->
        <div class="filters">
            <select id="reportType" onchange="toggleFilters()">
                <option value="mensal">Relatório Mensal</option>
                <option value="anual">Relatório Anual</option>
            </select>
            <select id="mes" name="mes"></select>
            <input type="number" id="ano" name="ano" placeholder="Ano">
            <button onclick="gerarRelatorio()">Gerar Relatório</button>
        </div>

        <div id="loading" class="loading" style="display: none;">Carregando...</div>
        <div id="error" class="error" style="display: none;"></div>

        <!-- Seção do Relatório Mensal -->
        <div id="monthlyReport" class="report-section">
            <h2 id="monthlyTitle"></h2>
            <div id="monthlySummary" class="summary"></div>
            
            <div id="paidSection">
                <h3>✅ Mensalidades Pagas</h3>
                <table id="paidTable">
                    <thead><tr><th>Empresa</th><th>CNPJ</th><th>Valor Pago</th><th>Data Pagamento</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
            
            <div id="pendingSection">
                <h3>⏳ Mensalidades Pendentes</h3>
                <table id="pendingTable">
                    <thead><tr><th>Empresa</th><th>CNPJ</th><th>Valor</th><th>Vencimento</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>

            <div id="overdueSection">
                <h3>❌ Mensalidades Atrasadas</h3>
                <table id="overdueTable">
                     <thead><tr><th>Empresa</th><th>CNPJ</th><th>Valor</th><th>Vencimento</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <!-- Seção do Relatório Anual -->
        <div id="annualReport" class="report-section">
            <h2 id="annualTitle"></h2>
            <div id="annualSummary" class="summary"></div>
            <table>
                <thead><tr><th>Mês</th><th>Receita Total</th></tr></thead>
                <tbody id="annualTableBody"></tbody>
            </table>
        </div>
    </div>

    <script src="shared.js"></script>
    <script>
        let currentUser;

        document.addEventListener('DOMContentLoaded', async () => {
            const userResponse = await fetchWithAuth('/api/auth');
            if (!userResponse) return;

            currentUser = await userResponse.json();
            createHeader('header-placeholder', currentUser);

            if (!['admin', 'gerente'].includes(currentUser.role)) {
                alert('Acesso negado. Apenas administradores e gerentes podem ver os relatórios.');
                document.querySelector('.container').innerHTML = '<h1>Acesso Negado</h1><p>Você não tem permissão para visualizar esta página.</p>';
            } else {
                document.body.style.display = 'block';
                setupFilters();
                toggleFilters();
            }
        });

        function setupFilters() {
            const mesSelect = document.getElementById('mes');
            const anoInput = document.getElementById('ano');
            const anoAtual = new Date().getFullYear();
            anoInput.value = anoAtual;

            const meses = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
            meses.forEach((mes, index) => {
                mesSelect.options.add(new Option(mes, index + 1));
            });

            mesSelect.value = new Date().getMonth() + 1;
        }

        function toggleFilters() {
            const reportType = document.getElementById('reportType').value;
            document.getElementById('mes').style.display = reportType === 'mensal' ? 'inline-block' : 'none';
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
            document.getElementById('monthlyReport').style.display = 'none';
            document.getElementById('annualReport').style.display = 'none';
            document.getElementById('error').style.display = 'none';
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        async function gerarRelatorio() {
            showLoading(true);
            const reportType = document.getElementById('reportType').value;
            const ano = document.getElementById('ano').value;

            try {
                if (reportType === 'mensal') {
                    const mes = document.getElementById('mes').value;
                    if (!mes || !ano) throw new Error("Mês e Ano são obrigatórios para o relatório mensal.");
                    const response = await fetchWithAuth(`/api/relatorios/mensal?mes=${mes}&ano=${ano}`);
                    if (!response.ok) throw new Error((await response.json()).msg || 'Erro ao buscar relatório mensal.');
                    const data = await response.json();
                    renderMonthlyReport(data);
                } else { // anual
                    if (!ano) throw new Error("O Ano é obrigatório para o relatório anual.");
                    const response = await fetchWithAuth(`/api/relatorios/anual?ano=${ano}`);
                    if (!response.ok) throw new Error((await response.json()).msg || 'Erro ao buscar relatório anual.');
                    const data = await response.json();
                    renderAnnualReport(data, ano);
                }
            } catch (err) {
                showError(err.message);
            } finally {
                loading.style.display = 'none';
            }
        }

        function renderMonthlyReport(data) {
            document.getElementById('monthlyReport').style.display = 'block';
            document.getElementById('monthlyTitle').textContent = `Relatório de ${document.getElementById('mes').options[document.getElementById('mes').selectedIndex].text} de ${data.periodo.ano}`;

            const summary = document.getElementById('monthlySummary');
            summary.innerHTML = `
                <div class="summary-card"><h3>Receita Realizada</h3><p>${formatarMoeda(data.receita)}</p></div>
                <div class="summary-card"><h3>Mensalidades Pagas</h3><p>${data.pagas.quantidade}</p></div>
                <div class="summary-card"><h3>Pendentes</h3><p>${data.pendentes.quantidade}</p></div>
                <div class="summary-card"><h3>Atrasadas</h3><p>${data.atrasadas.quantidade}</p></div>
            `;

            populateTable('paidTable', data.pagas.lista, ['empresa.nome', 'empresa.cnpj', 'valor', 'dataPagamento']);
            populateTable('pendingTable', data.pendentes.lista, ['empresa.nome', 'empresa.cnpj', 'valor', 'dataVencimento']);
            populateTable('overdueTable', data.atrasadas.lista, ['empresa.nome', 'empresa.cnpj', 'valor', 'dataVencimento']);
        }

        function renderAnnualReport(data, ano) {
            document.getElementById('annualReport').style.display = 'block';
            document.getElementById('annualTitle').textContent = `Relatório Anual de ${ano}`;
            
            const totalReceita = data.reduce((acc, item) => acc + item.receitaTotal, 0);
            document.getElementById('annualSummary').innerHTML = `
                <div class="summary-card"><h3>Receita Total do Ano</h3><p>${formatarMoeda(totalReceita)}</p></div>
            `;

            const tableBody = document.getElementById('annualTableBody');
            tableBody.innerHTML = '';
            const meses = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
            
            const monthlyData = new Map(data.map(item => [item._id, item.receitaTotal]));

            for (let i = 1; i <= 12; i++) {
                const receita = monthlyData.get(i) || 0;
                const row = tableBody.insertRow();
                row.insertCell(0).textContent = meses[i - 1];
                row.insertCell(1).textContent = formatarMoeda(receita);
            }
        }

        function populateTable(tableId, data, columns) {
            const tableSection = document.getElementById(tableId).parentElement;
            const tbody = document.getElementById(tableId).querySelector('tbody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tableSection.style.display = 'none';
                return;
            }
            tableSection.style.display = 'block';

            data.forEach(item => {
                const row = tbody.insertRow();
                columns.forEach(col => {
                    let cellValue = col.split('.').reduce((o, i) => o ? o[i] : '', item);
                    if (col.includes('data')) {
                        cellValue = cellValue ? formatarData(cellValue) : 'N/A';
                    }
                    if (typeof cellValue === 'number') {
                        cellValue = formatarMoeda(cellValue);
                    }
                    row.insertCell().textContent = cellValue || 'N/A';
                });
            });
        }

        // Funções de formatação (adicione ao seu shared.js se preferir)
        function formatarMoeda(valor) {
            return (valor || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function formatarCNPJ(cnpj) {
            return cnpj ? cnpj.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5') : '';
        }

        function formatarData(dataISO) {
            return dataISO ? new Date(dataISO).toLocaleDateString('pt-BR', { timeZone: 'UTC' }) : '';
        }
    </script>
</body>
</html>
