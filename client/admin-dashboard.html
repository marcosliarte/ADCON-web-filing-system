<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ADCON - Central do Administrador</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Estilos consistentes com o restante do sistema */
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background-color: #f4f7f6; }
        .header { background-color: #007bff; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); }
        .header h1 { margin: 0; font-size: 1.5rem; }
        .dropdown { position: relative; display: inline-block; }
        .dropdown-toggle { background-color: transparent; border: none; color: white; padding: 0.5rem; font-size: 1rem; cursor: pointer; display: flex; align-items: center; }
        .dropdown-content { display: none; position: absolute; right: 0; background-color: white; min-width: 180px; box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2); z-index: 1; border-radius: 5px; overflow: hidden; }
        .dropdown-content a { color: #333a40; padding: 12px 16px; text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .dropdown-content a:hover { background-color: #f1f1f1; }
        .show { display: block; }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        h1.page-title { color: #007bff; border-bottom: 2px solid #007bff; padding-bottom: 0.5rem; margin-bottom: 1.5rem; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
        .widget { background-color: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.06); }
        .widget h3 { margin-top: 0; color: #007bff; border-bottom: 1px solid #eee; padding-bottom: 0.5rem; }
        .widget-item { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; font-size: 1.1rem; }
        .widget-item span:first-child { font-weight: 500; }
        .status-indicator { padding: 0.3rem 0.8rem; border-radius: 12px; color: white; font-size: 0.9rem; }
        .status-ok { background-color: #28a745; }
        .status-error { background-color: #dc3545; }
        /* --- NOVOS ESTILOS --- */
        .log-list { list-style: none; padding: 0; max-height: 200px; overflow-y: auto; border-top: 1px solid #eee; margin-top: 1rem; }
        .log-item { padding: 0.5rem; border-bottom: 1px solid #f1f1f1; font-size: 0.9rem; }
        .log-item:last-child { border-bottom: none; }
        .log-item .log-time { color: #6c757d; font-size: 0.8rem; display: block; }
        .log-item .log-user { font-weight: bold; }
        .log-item .log-device { color: #6c757d; font-size: 0.8rem; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        /* --------------------- */

        /* --- ESTILOS PARA A BARRA DE ROLAGEM DOS ALERTAS --- */
        #alerts-widget {
            max-height: 200px; /* Altura máxima da caixa de alertas */
            overflow-y: auto;  /* Ativa a barra de rolagem vertical quando necessário */
            border: 1px solid #eee;
            border-radius: 4px;
            padding: 0.5rem;
        }
        #alerts-widget ul { list-style: none; padding: 0; margin: 0; }
        #alerts-widget li { padding: 0.5rem 0; border-bottom: 1px solid #f1f1f1; }
        #alerts-widget li:last-child { border-bottom: none; }
        /* ---------------------------------------------------- */
        .quick-links { display: flex; gap: 1rem; margin-top: 1rem; flex-wrap: wrap; }
        .quick-links a { background-color: #6c757d; color: white; text-decoration: none; padding: 0.6rem 1rem; border-radius: 5px; transition: background-color 0.2s; }
        .quick-links a:hover { background-color: #5a6268; }
        .backup-list { list-style: none; padding: 0; max-height: 200px; overflow-y: auto; border: 1px solid #eee; border-radius: 4px; }
        .backup-item { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem; border-bottom: 1px solid #eee; }
        .backup-item:last-child { border-bottom: none; }
        .backup-actions button, .backup-actions a button { font-size: 0.8rem; padding: 0.3rem 0.6rem; margin-left: 5px; border: none; border-radius: 4px; cursor: pointer; }
        .backup-actions .btn-download { background-color: #17a2b8; color: white; }
        .backup-actions .btn-restore { background-color: #ffc107; color: #212529; }
        .backup-actions .btn-delete { background-color: #dc3545; color: white; }
    </style>
</head>
<body style="display: none;">
    <script>
        if (!localStorage.getItem('token')) window.location.replace('login.html');
    </script>
    <div id="header-placeholder"></div>

    <div class="container">
        <h1 class="page-title">Central do Administrador</h1>

        <div class="dashboard-grid">
            <!-- Widget de Saúde do Sistema -->
            <div class="widget">
                <h3>Saúde do Sistema</h3>
                <div id="system-status-widget">
                    <p>Carregando status...</p>
                </div>
            </div>

            <!-- NOVO WIDGET: Logs de Atividade Recente -->
            <div class="widget">
                <h3>Atividade Recente</h3>
                <div id="recent-logs-widget">
                    <p>Carregando logs...</p>
                </div>
            </div>

            <!-- Widget de Alertas -->
            <div class="widget">
                <h3>Alertas e Vencimentos</h3>
                <div id="alerts-widget">
                    <p>Carregando alertas...</p>
                </div>
            </div>

            <!-- Widget de Ações Rápidas -->
            <div class="widget">
                <h3>Ações Rápidas</h3>
                <div class="quick-links">
                    <a href="user-management.html">Gerenciar Usuários</a>
                    <a href="logs.html">Ver Logs de Atividade</a>
                    <a href="configuracao-empresa.html">Configurações Gerais</a>
                </div>
            </div>

            <!-- Widget de Backup -->
            <div class="widget">
                <h3>Backup e Restauração</h3>
                <button onclick="criarBackup()">Criar Backup Agora</button>
                <!-- CAMPO PARA CARREGAR BACKUP -->
                <div style="margin-top: 1rem; border-top: 1px solid #eee; padding-top: 1rem;">
                    <label for="backup-file-input" style="display: block; margin-bottom: 0.5rem;">Ou carregue um arquivo de backup (.zip) para restaurar:</label>
                    <input type="file" id="backup-file-input" accept=".zip" style="font-size: 0.9rem;">
                    <button onclick="carregarBackup()" style="margin-top: 0.5rem;">Carregar e Restaurar</button>
                </div>

                <div id="backup-status" style="margin-top: 1rem;"></div>
                <h4 style="margin-top: 1.5rem; margin-bottom: 0.5rem;">Backups Disponíveis:</h4>
                <ul id="backup-list" class="backup-list">
                </ul>
            </div>
        </div>
    </div>

    <script src="shared.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const userResponse = await fetchWithAuth('/api/auth');
            if (!userResponse) return;

            const usuario = await userResponse.json();
            createHeader('header-placeholder', usuario);

            if (usuario.role !== 'admin') {
                document.querySelector('.container').innerHTML = '<h1>Acesso Negado</h1><p>Apenas administradores podem acessar esta página.</p>';
                document.body.style.display = 'block';
                return;
            }

            document.body.style.display = 'block';
            loadSystemStatus();
            loadAlerts();
            loadRecentLogs(); // Chama a nova função
            loadBackups();
        });

        async function loadSystemStatus() {
            const widget = document.getElementById('system-status-widget');
            try {
                const response = await fetchWithAuth('/api/admin/dashboard/status');
                if (!response.ok) throw new Error('Falha ao carregar status.');
                const data = await response.json();

                const dbStatusClass = data.dbStatus.state === 1 ? 'status-ok' : 'status-error';

                widget.innerHTML = `
                    <div class="widget-item">
                        <span>Banco de Dados</span>
                        <span class="status-indicator ${dbStatusClass}">${data.dbStatus.status}</span>
                    </div>
                    <div class="widget-item">
                        <span>Total de Usuários</span>
                        <span>${data.counts.usuarios}</span>
                    </div>
                    <div class="widget-item">
                        <span>Total de Empresas</span>
                        <span>${data.counts.empresas}</span>
                    </div>
                    <div class="widget-item">
                        <span>Uso de Disco (Uploads)</span>
                        <span>${data.diskUsage.uploads.megabytes} MB</span>
                    </div>
                    <div class="widget-item">
                        <span>Uso de Disco (Backups)</span>
                        <span>${data.diskUsage.backups.megabytes} MB</span>
                    </div>
                `;
            } catch (error) {
                widget.innerHTML = `<p style="color: red;">${error.message}</p>`;
            }
        }

        async function loadAlerts() {
            const widget = document.getElementById('alerts-widget');
            try {
                const response = await fetchWithAuth('/api/admin/dashboard/expiring-docs');
                if (!response.ok) throw new Error('Falha ao carregar alertas.');
                const alertas = await response.json();

                if (alertas.length === 0) {
                    widget.innerHTML = '<p>Nenhum documento vencendo nos próximos 30 dias.</p>';
                    return;
                }

                let html = '<ul>';
                alertas.forEach(alerta => {
                    html += `<li>
                        <strong>${alerta.empresaNome}:</strong> ${alerta.documento} vence em ${alerta.diasRestantes} dias.
                    </li>`;
                });
                html += '</ul>';
                widget.innerHTML = html;

            } catch (error) {
                widget.innerHTML = `<p style="color: red;">${error.message}</p>`;
            }
        }

        // --- NOVA FUNÇÃO PARA CARREGAR LOGS RECENTES ---
        async function loadRecentLogs() {
            const widget = document.getElementById('recent-logs-widget');
            try {
                const response = await fetchWithAuth('/api/admin/logs/recent');
                if (!response.ok) throw new Error('Falha ao carregar logs recentes.');
                const logs = await response.json();

                if (logs.length === 0) {
                    widget.innerHTML = '<p>Nenhuma atividade recente registrada.</p>';
                    return;
                }

                let html = '<ul class="log-list">';
                logs.forEach(log => {
                    // CORREÇÃO: Lógica mais segura para extrair informações do dispositivo.
                    // Garante que o código não quebre se 'log.dispositivo' for nulo ou tiver um formato inesperado.
                    const deviceMatch = log.dispositivo ? log.dispositivo.match(/\(([^)]+)\)/) : null;
                    const deviceInfo = deviceMatch && deviceMatch[1] ? deviceMatch[1].split(';').slice(0, 2).join('; ') : 'Dispositivo não informado';

                    html += `<li class="log-item">
                        <span class="log-time">${new Date(log.createdAt).toLocaleString('pt-BR')}</span>
                        <div><span class="log-user">${log.usuarioNome}</span>: ${log.acao}</div>
                        <span class="log-device" title="${log.dispositivo || ''}">${deviceInfo}</span>
                    </li>`;
                });
                html += '</ul>';
                widget.innerHTML = html;
            } catch (error) {
                widget.innerHTML = `<p style="color: red;">${error.message}</p>`;
            }
        }

        // --- FUNÇÕES DE BACKUP ---

        async function baixarBackup(event, nomeArquivoIncorreto) {
            event.preventDefault();
            const button = event.currentTarget.querySelector('button');
            const originalText = button.textContent;
            button.textContent = 'Baixando...';
            button.disabled = true;

            // ALTERAÇÃO: Envia o nome do arquivo exatamente como a API de listagem o fornece.
            // A lógica de "tradução" do nome deve ser feita no backend.
            const urlDownload = `/api/admin/backup/download/${nomeArquivoIncorreto}`;

            try {
                const response = await fetchWithAuth(urlDownload);

                if (!response.ok) {
                    // CORREÇÃO: Clona a resposta para evitar o erro "body stream already read".
                    // Isso permite que tentemos ler o corpo como JSON e, se falhar, como texto.
                    const responseClone = response.clone();
                    let errorMessage;
                    try {
                        const errorData = await response.json();
                        errorMessage = errorData.msg || JSON.stringify(errorData);
                    } catch (jsonError) {
                        // Se a leitura como JSON falhar, lê a resposta clonada como texto.
                        errorMessage = await responseClone.text();
                    }
                    throw new Error(errorMessage || `Erro ${response.status}: Falha no download`);
                }

                // Converte a resposta em um blob (dados binários do arquivo)
                const blob = await response.blob();
                if (blob.size === 0) {
                    throw new Error("O servidor retornou um arquivo vazio. Verifique se o arquivo de backup existe e não está corrompido.");
                }

                // Cria uma URL temporária para o blob
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = downloadUrl;
                a.download = nomeArquivoIncorreto; // Usa o nome que o usuário vê na lista.
                document.body.appendChild(a);
                a.click(); // Simula o clique para iniciar o download
                window.URL.revokeObjectURL(downloadUrl); // Libera a memória
                a.remove();
            } catch (error) {
                alert(`Erro ao baixar o arquivo: ${error.message}`);
            } finally {
                button.textContent = originalText;
                button.disabled = false;
            }
        }

        async function loadBackups() {
            const list = document.getElementById('backup-list');
            list.innerHTML = '<li>Carregando...</li>';
            try {
                const response = await fetchWithAuth('/api/admin/backup/list');
                if (!response.ok) throw new Error('Falha ao listar backups.');
                const backups = await response.json();

                if (backups.length === 0) {
                    list.innerHTML = '<li>Nenhum backup encontrado.</li>';
                    return;
                }

                list.innerHTML = '';
                backups.forEach(backup => {
                    const item = document.createElement('li');
                    item.className = 'backup-item';
                    item.innerHTML = `
                        <div>
                            <strong>${backup.filename}</strong><br>
                            <small>${new Date(backup.createdAt).toLocaleString('pt-BR')} - ${backup.size} MB</small>
                        </div>
                        <div class="backup-actions">
                            <a href="#" onclick="baixarBackup(event, '${backup.filename}')"><button class="btn-download">Baixar</button></a>
                            <button class="btn-restore" onclick="restaurarBackup('${backup.filename}')">Restaurar</button>
                            <button class="btn-delete" onclick="excluirBackup('${backup.filename}')">Excluir</button>
                        </div>
                    `;
                    list.appendChild(item);
                });
            } catch (error) {
                list.innerHTML = `<li style="color: red;">${error.message}</li>`;
            }
        }

        async function criarBackup() {
            const statusDiv = document.getElementById('backup-status');
            statusDiv.innerHTML = '<p>Criando backup, por favor aguarde...</p>';
            try {
                const response = await fetchWithAuth('/api/admin/backup/create', { method: 'POST' });
                const result = await response.json();
                if (!response.ok) throw new Error(result.msg || 'Falha ao iniciar o backup.');

                statusDiv.innerHTML = `<p style="color: green;">${result.msg}</p>`;
                loadBackups(); // Atualiza a lista
            } catch (error) {
                statusDiv.innerHTML = `<p style="color: red;">${error.message}</p>`;
            }
        }

        async function restaurarBackup(filename) {
            const confirmacao = prompt(`AÇÃO PERIGOSA!\n\nVocê está prestes a substituir TODOS os dados atuais do sistema pelos dados do backup "${filename}".\n\nPara confirmar, digite "RESTAURAR" no campo abaixo:`);
            if (confirmacao !== 'RESTAURAR') {
                alert('Restauração cancelada.');
                return;
            }

            const statusDiv = document.getElementById('backup-status');
            statusDiv.innerHTML = '<p>Restaurando banco de dados... O sistema pode ficar instável por alguns instantes.</p>';
            try {
                const response = await fetchWithAuth('/api/admin/backup/restore', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filename })
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.msg || 'Falha ao restaurar.');

                alert(result.msg); // Alerta de sucesso
                window.location.reload(); // Recarrega a página para refletir os dados restaurados
            } catch (error) {
                statusDiv.innerHTML = `<p style="color: red;">${error.message}</p>`;
            }
        }

        async function carregarBackup() {
            const fileInput = document.getElementById('backup-file-input');
            const file = fileInput.files[0];
            const statusDiv = document.getElementById('backup-status');

            if (!file) {
                alert('Por favor, selecione um arquivo de backup para carregar.');
                return;
            }

            if (!file.name.endsWith('.zip')) {
                alert('Por favor, selecione um arquivo de backup válido (com extensão .zip).');
                return;
            }

            const confirmacao = prompt(`AÇÃO PERIGOSA!\n\nVocê está prestes a substituir TODOS os dados atuais do sistema pelos dados do arquivo "${file.name}".\n\nPara confirmar, digite "RESTAURAR" no campo abaixo:`);
            if (confirmacao !== 'RESTAURAR') {
                alert('Restauração cancelada.');
                fileInput.value = ''; // Limpa o input de arquivo
                return;
            }

            statusDiv.innerHTML = `<p>Carregando e restaurando o arquivo "${file.name}"...</p>`;

            const formData = new FormData();
            formData.append('backupFile', file);

            try {
                const response = await fetchWithAuth('/api/admin/backup/upload', {
                    method: 'POST',
                    body: formData,
                });

                // CORREÇÃO: Verifica se a resposta foi bem-sucedida ANTES de tentar ler como JSON.
                if (!response.ok) {
                    // Se a resposta for um erro, tenta ler como texto para ver a mensagem real (que pode ser HTML).
                    const errorText = await response.text();
                    // O erro "Cannot POST /..." indica que a rota não existe no backend.
                    throw new Error(errorText || 'Falha ao carregar o backup.');
                }

                const result = await response.json(); // Agora só executa em caso de sucesso.
                alert(result.msg);
                window.location.reload();
            } catch (error) {
                // Usa .textContent para exibir o erro como texto puro, evitando que o HTML seja renderizado.
                const p = document.createElement('p');
                p.style.color = 'red';
                p.textContent = error.message;
                statusDiv.innerHTML = '';
                statusDiv.appendChild(p);
            } finally {
                fileInput.value = '';
            }
        }

        async function excluirBackup(filename) {
            if (!confirm(`Tem certeza que deseja excluir o arquivo de backup "${filename}" permanentemente?`)) return;
            try {
                const response = await fetchWithAuth(`/api/admin/backup/delete/${filename}`, { method: 'DELETE' });
                if (!response.ok) throw new Error('Falha ao excluir o backup.');
                loadBackups(); // Atualiza a lista
            } catch (error) {
                alert(`Erro: ${error.message}`);
            }
        }
    </script>
</body>
</html>
