<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>ADCON - Configurações da Conta</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/pages/account-settings.css">
</head>
<body style="display:none;">
  <script>
    if (localStorage.getItem('token')) {
      document.body.style.display = 'block';
    } else {
      window.location.replace('login.html');
    }
  </script>
  <script src="shared.js"></script>
  <script src="js/pages/account-settings.js"></script>

  <div class="header">
    <h1>ADCON - Configurações da Conta</h1>
    <div class="user-actions dropdown">
      <button class="dropdown-toggle" id="userMenuBtn">
        <span id="header-user-name" style="margin-right:0.5rem;" class="skeleton"></span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="12" cy="8" r="3" stroke="white" stroke-width="1.5"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div id="userMenu" class="dropdown-content">
        <a href="#" onclick="logout()"><span>⏻</span> Sair</a>
      </div>
    </div>
  </div>

  <div class="container">
    <a class="back-btn" href="home.html">Voltar para Home</a>

    <div class="card">
      <h2 id="sec-senha">Alterar Senha</h2>
      <form id="changePasswordForm">
        <div class="input-group">
          <label for="senhaAtual">Senha Atual</label>
          <div class="input-with-action">
            <input type="password" id="senhaAtual" autocomplete="current-password" required>
            <button type="button" class="toggle-visibility" aria-label="Mostrar/ocultar senha atual" data-target="senhaAtual">Mostrar</button>
          </div>
        </div>
        <div class="input-group">
          <label for="novaSenha">Nova Senha</label>
          <div class="input-with-action">
            <input type="password" id="novaSenha" autocomplete="new-password" required>
            <button type="button" class="toggle-visibility" aria-label="Mostrar/ocultar nova senha" data-target="novaSenha">Mostrar</button>
          </div>
          <div class="strength-meter" aria-hidden="true">
            <div class="bar" id="pw-bar-1"></div>
            <div class="bar" id="pw-bar-2"></div>
            <div class="bar" id="pw-bar-3"></div>
            <div class="bar" id="pw-bar-4"></div>
          </div>
          <ul class="validation-list" id="pw-rules">
            <li data-rule="len">Mínimo de 8 caracteres</li>
            <li data-rule="upper">Letra maiúscula</li>
            <li data-rule="lower">Letra minúscula</li>
            <li data-rule="digit">Número</li>
            <li data-rule="special">Caractere especial (!@#$%…)</li>
          </ul>
        </div>
        <div class="input-group">
          <label for="confirmarNovaSenha">Confirmar Nova Senha</label>
          <div class="input-with-action">
            <input type="password" id="confirmarNovaSenha" autocomplete="new-password" required>
            <button type="button" class="toggle-visibility" aria-label="Mostrar/ocultar confirmar senha" data-target="confirmarNovaSenha">Mostrar</button>
          </div>
          <small id="pw-match" class="helper-text"></small>
        </div>
        <button type="submit" id="btnSubmitSenha" disabled>Alterar Senha</button>
      </form>
    </div>

    <div class="card">
      <h2 id="sec-email">Alterar Email</h2>
      <form id="changeEmailForm">
        <div class="input-group">
          <label for="novoEmail">Novo Email</label>
          <input type="email" id="novoEmail" autocomplete="email" required>
          <small id="emailFormatMsg" class="helper-text"></small>
        </div>
        <div class="input-group">
          <label for="confirmarNovoEmail">Confirmar Novo Email</label>
          <input type="email" id="confirmarNovoEmail" autocomplete="email" required>
          <small id="emailMatchMsg" class="helper-text"></small>
        </div>
        <button type="submit" id="btnSubmitEmail" disabled>Alterar Email</button>
      </form>
    </div>
  </div>

  <div class="footer">&copy; 2025 ADCON. Todos os direitos reservados.</div>
</body>
</html>
