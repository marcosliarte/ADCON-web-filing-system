<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ADCON - Documentos a Vencer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Estilos consistentes com o restante do sistema */
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background-color: #f4f7f6; color: #333; }
        .header { background-color: #007bff; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); }
        .header h1 { margin: 0; font-size: 1.5rem; }
        .dropdown { position: relative; display: inline-block; }
        .dropdown-toggle { background-color: transparent; border: none; color: white; padding: 0.5rem; font-size: 1rem; cursor: pointer; display: flex; align-items: center; }
        .dropdown-content { display: none; position: absolute; right: 0; background-color: white; min-width: 180px; box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2); z-index: 1; border-radius: 5px; overflow: hidden; }
        .dropdown-content a { color: #333a40; padding: 12px 16px; text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .dropdown-content a:hover { background-color: #f1f1f1; }        
        .show { display: block; }
        .container { max-width: 1200px; margin: 2rem auto; background-color: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
        h1.page-title { color: #007bff; border-bottom: 2px solid #007bff; padding-bottom: 0.5rem; margin-bottom: 1.5rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 1em; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; vertical-align: middle; }
        th { background-color: #e9ecef; font-weight: 600; }
        td a { color: #007bff; text-decoration: none; font-weight: 500; }
        td a:hover { text-decoration: underline; }
        .status-badge { font-weight: bold; padding: 0.3rem 0.8rem; border-radius: 12px; font-size: 0.85rem; text-align: center; display: inline-block; }
        .status-vencendo { color: #856404; background-color: #fff3cd; }
        .status-vencido { color: #721c24; background-color: #f8d7da; }
    </style>
</head>
<body style="display: none;">
    <script>
        if (!localStorage.getItem('token')) {
            window.location.replace('login.html');
        }
    </script>
    <div id="header-placeholder"></div>

    <div class="container">
        <h1 class="page-title">Documentos Próximos do Vencimento</h1>
        <p>Lista de documentos de empresas que irão vencer nos próximos 30 dias ou que já venceram.</p>

        <table id="tabela-documentos">
            <thead>
                <tr>
                    <th>Empresa</th>
                    <th>Documento</th>
                    <th>Data de Vencimento</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="4">Carregando documentos...</td></tr>
            </tbody>
        </table>
    </div>

    <script src="shared.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const userResponse = await fetchWithAuth('/api/auth');
            if (!userResponse) return;

            const usuario = await userResponse.json();
            createHeader('header-placeholder', usuario);

            // Apenas admin, gerente e funcionário podem ver esta página
            if (!['admin', 'gerente', 'funcionario'].includes(usuario.role)) {
                document.querySelector('.container').innerHTML = '<h1>Acesso Negado</h1><p>Você não tem permissão para acessar esta página.</p>';
                document.body.style.display = 'block';
                return;
            }

            document.body.style.display = 'block';
            carregarDocumentos();
        });

        async function carregarDocumentos() {
            const tbody = document.querySelector('#tabela-documentos tbody');
            tbody.innerHTML = '<tr><td colspan="4">Carregando documentos...</td></tr>';

            try {
                // Reutilizando o endpoint do dashboard de admin que já busca documentos a vencer
                const response = await fetchWithAuth(`/api/admin/dashboard/expiring-docs`);
                if (!response.ok) throw new Error('Falha ao carregar os documentos.');

                const documentos = await response.json();

                if (documentos.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4">Nenhum documento próximo do vencimento ou vencido.</td></tr>';
                    return;
                }

                tbody.innerHTML = ''; // Limpa a tabela
                documentos.forEach(doc => {
                    const row = tbody.insertRow();
                    row.insertCell(0).innerHTML = `<a href="detalhes-empresa.html?id=${doc.empresaId}">${doc.empresaNome}</a>`;
                    row.insertCell(1).textContent = doc.documento;
                    row.insertCell(2).textContent = new Date(doc.dataValidade).toLocaleDateString('pt-BR', { timeZone: 'UTC' });
                    
                    const statusCell = row.insertCell(3);
                    const statusBadge = document.createElement('span');
                    statusBadge.classList.add('status-badge');
                    if (doc.diasRestantes < 0) {
                        statusBadge.textContent = `Vencido há ${Math.abs(doc.diasRestantes)} dias`;
                        statusBadge.classList.add('status-vencido');
                    } else {
                        statusBadge.textContent = `Vence em ${doc.diasRestantes} dias`;
                        if (doc.diasRestantes <= 30) statusBadge.classList.add('status-vencendo');
                    }
                    statusCell.appendChild(statusBadge);
                });

            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="4" style="color: red;">${error.message}</td></tr>`;
            }
        }
    </script>
</body>
</html>
