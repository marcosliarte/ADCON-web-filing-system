<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ADCON - Gerenciar Usuários</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Estilos do cabeçalho (copiados de home.html para consistência) */
        .header { background-color: #007bff; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); }
        .header h1 { margin: 0; font-size: 1.5rem; }
        .dropdown { position: relative; display: inline-block; }
        .dropdown-toggle { background-color: transparent; border: none; color: white; padding: 0.5rem; font-size: 1rem; cursor: pointer; display: flex; align-items: center; }
        .dropdown-content { display: none; position: absolute; right: 0; background-color: white; min-width: 180px; box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2); z-index: 1; border-radius: 5px; overflow: hidden; }
        .dropdown-content a { color: #333a40; padding: 12px 16px; text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .dropdown-content a:hover { background-color: #f1f1f1; }
        .show { display: block; }
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background-color: #f4f7f6; color: #333; }
        .container { max-width: 1200px; margin: 2rem auto; background-color: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
        h1 { color: #007bff; border-bottom: 2px solid #007bff; padding-bottom: 0.5rem; margin-bottom: 1.5rem; }
        .form-section, .list-section { margin-bottom: 2rem; padding: 1.5rem; border: 1px solid #dee2e6; border-radius: 5px; background-color: #f8f9fa; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        input[type="text"], input[type="email"], input[type="password"], select {
            width: calc(100% - 16px);
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 0.7rem 1.2rem;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            margin-right: 0.5rem;
        }
        button:hover { background-color: #0056b3; }
        button.delete-btn { background-color: #dc3545; }
        button.delete-btn:hover { background-color: #c82333; }
        button.action-btn { font-size: 0.8rem; padding: 0.4rem 0.6rem; margin-left: 5px; }
        button.impersonate-btn { background-color: #ffc107; color: #212529; }
        table { width: 100%; border-collapse: collapse; margin-top: 1em; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #e9ecef; }
        .message { margin-top: 1rem; padding: 1rem; border-radius: 5px; }
        .message.success { background-color: #d4edda; color: #155724; border-color: #c3e6cb; }
        .message.error { background-color: #f8d7da; color: #721c24; border-color: #f5c6cb; }
    </style>
</head>
<body style="display: none;">
    <!-- Script de bloqueio de acesso e exibição de conteúdo -->
    <script>
        if (localStorage.getItem('token')) {
            document.body.style.display = 'block';
        } else {
            window.location.replace('login.html');
        }
    </script>

    <div id="header-placeholder"></div>

    <div class="container">
        <h1>Gerenciar Usuários</h1>
        
        <div class="form-section">
            <h2>Criar Novo Usuário</h2>
            <form id="createUserForm">
                <div class="form-group">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" required>
                </div>
                <div class="form-group">
                    <label for="role">Perfil:</label>
                    <select id="role" name="role" required>
                        <option value="funcionario">Funcionário</option>
                        <option value="gerente">Gerente</option>
                        <option value="empresario">Empresário</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
                <button type="submit">Criar Usuário</button>
                <div id="createMessage" class="message"></div>
            </form>
        </div>

        <div class="list-section">
            <h2>Lista de Usuários</h2>
            <table id="usersTable">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Email</th>
                        <th>Perfil</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="4">Carregando usuários...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="shared.js"></script>
    <script>
        let currentUser; // Usuário logado (admin)

        async function getAdminUser() {
            const response = await fetchWithAuth('/api/auth');
            if (response) {
                currentUser = await response.json();
                createHeader('header-placeholder', currentUser); // Cria o cabeçalho
                if (!['admin', 'gerente'].includes(currentUser.role)) {
                    alert('Acesso negado. Apenas administradores podem gerenciar usuários.');
                    window.location.href = 'home.html';
                }
            }
        }

        async function loadUsers() {
            try {
                const response = await fetchWithAuth('/api/auth/admin/users');
                if (response && response.ok) {
                    const users = await response.json();
                    const tbody = document.querySelector('#usersTable tbody');
                    tbody.innerHTML = '';
                    users.forEach(user => {
                        const row = tbody.insertRow();
                        row.insertCell(0).textContent = user.nome;
                        row.insertCell(1).textContent = user.email;
                        
                        // Célula de Perfil (agora com um <select>)
                        const roleCell = row.insertCell(2);
                        const roleSelect = document.createElement('select');
                        roleSelect.id = `role-select-${user._id}`;
                        roleSelect.innerHTML = `
                            <option value="funcionario">Funcionário</option>
                            <option value="empresario">Empresário</option>
                            <option value="gerente">Gerente</option>
                            ${currentUser.role === 'admin' ? '<option value="admin">Administrador</option>' : ''}
                        `;
                        roleSelect.value = user.role;
                        roleCell.appendChild(roleSelect);

                        // Célula de Ações
                        const actionsCell = row.insertCell(3);

                        // Condições para desabilitar ações
                        const isSelf = user._id === currentUser._id;
                        const isTargetAdmin = user.role === 'admin';
                        const isModifierManager = currentUser.role === 'gerente';

                        if (isSelf) {
                            roleSelect.disabled = true;
                            actionsCell.textContent = 'Você';
                        } else if (isModifierManager && isTargetAdmin) {
                            // Gerente não pode editar ou excluir admin
                            roleSelect.disabled = true;
                            actionsCell.textContent = 'Ação não permitida';
                        } else {
                            // Adiciona o evento para alterar o perfil
                            roleSelect.addEventListener('change', () => {
                                // Apenas admins podem alterar perfis
                                if (currentUser.role === 'admin') {
                                    updateUserRole(user._id, roleSelect.value, user.role);
                                } else {
                                    roleSelect.disabled = true;
                                }
                            });

                            let buttonsHtml = ''; // Inicia a string de botões

                            // Lógica para o botão de exclusão
                            // Admin pode excluir, ou Gerente pode excluir funcionários/empresários
                            if ( (currentUser.role === 'admin') || (isModifierManager && (user.role === 'funcionario' || user.role === 'empresario')) ) {
                                buttonsHtml += `<button class="delete-btn action-btn" onclick="deleteUser('${user._id}')">Excluir</button>`;
                            }

                            // Apenas Admin vê os botões de Personificar e Resetar Senha.
                            // Esta verificação deve ser separada.
                            if (currentUser.role === 'admin') {
                                buttonsHtml += `
                                    <button class="action-btn impersonate-btn" onclick="impersonateUser('${user._id}')">Personificar</button>
                                    <button class="action-btn" onclick="resetUserPassword('${user._id}')">Resetar Senha</button>
                                `;
                            }

                            actionsCell.innerHTML = buttonsHtml;
                        }
                    });

                    // Ajusta as opções de criação de perfil com base no usuário logado
                    const roleSelect = document.getElementById('role');
                    if (currentUser.role === 'gerente') {
                        // Gerente não pode criar admin, então remove a opção
                        const adminOption = roleSelect.querySelector('option[value="admin"]');
                        if (adminOption) {
                            adminOption.remove();
                        }
                    } else if (currentUser.role === 'admin') {
                        // Admin pode tudo, garante que a ordem esteja correta
                        const adminOption = roleSelect.querySelector('option[value="admin"]');
                        // Move a opção de admin para o final para uma melhor UX
                        roleSelect.appendChild(adminOption);
                    }

                }
            } catch (error) {
                console.error('Erro ao carregar usuários:', error);
                alert('Erro ao carregar usuários.');
            }
        }

        async function updateUserRole(userId, newRole, oldRole) {
            const userRow = document.getElementById(`role-select-${userId}`);
            if (!confirm(`Tem certeza que deseja alterar o perfil deste usuário para "${newRole}"?`)) {
                userRow.value = oldRole; // Reverte a seleção se o usuário cancelar
                return;
            }

            try {
                const response = await fetchWithAuth(`/api/auth/admin/users/${userId}/role`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ role: newRole })
                });

                const result = await response.json();
                if (!response.ok) {
                    throw new Error(result.msg);
                }
                alert(result.msg);
                loadUsers(); // Recarrega a lista para garantir consistência
            } catch (error) {
                alert(`Erro: ${error.message}`);
                userRow.value = oldRole; // Reverte em caso de erro na API
            }
        }

        async function impersonateUser(userId) {
            if (!confirm('Você está prestes a navegar no sistema como este usuário. Deseja continuar?')) return;

            try {
                const response = await fetchWithAuth(`/api/auth/admin/impersonate/${userId}`, { method: 'POST' });
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.msg || 'Falha ao personificar usuário.');
                }
                const { token } = await response.json();
                localStorage.setItem('token', token);
                window.location.href = 'home.html'; // Redireciona para a home como o novo usuário
            } catch (error) {
                alert(`Erro: ${error.message}`);
            }
        }

        async function resetUserPassword(userId) {
            if (!confirm('Tem certeza que deseja resetar a senha deste usuário? Uma nova senha temporária será gerada.')) return;

            try {
                const response = await fetchWithAuth(`/api/auth/admin/users/${userId}/reset-password`, { method: 'POST' });
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.msg || 'Falha ao resetar a senha.');
                }
                const result = await response.json();
                // Exibe a senha temporária para o admin copiar
                alert(`${result.msg}\n\nNova Senha: ${result.tempPassword}\n\nPor favor, copie esta senha e a envie para o usuário de forma segura.`);
            } catch (error) {
                alert(`Erro: ${error.message}`);
            }
        }

        async function deleteUser(userId) {
            if (!confirm('Tem certeza que deseja excluir este usuário?')) {
                return;
            }
            try {
                const response = await fetchWithAuth(`/api/auth/admin/users/${userId}`, {
                    method: 'DELETE'
                });
                if (response && response.ok) {
                    alert('Usuário excluído com sucesso!');
                    loadUsers(); // Recarrega a lista
                } else {
                    const errorData = await response.json();
                    throw new Error(errorData.msg || 'Falha ao excluir usuário.');
                }
            } catch (error) {
                console.error('Erro ao excluir usuário:', error);
                alert(`Erro: ${error.message}`);
            }
        }

        document.getElementById('createUserForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const role = document.getElementById('role').value;
            const createMessage = document.getElementById('createMessage');

            try {
                const response = await fetchWithAuth('/api/auth/admin/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, email, senha, role })
                });

                if (response && response.ok) {
                    createMessage.className = 'message success';
                    createMessage.textContent = 'Usuário criado com sucesso!';
                    this.reset(); // Limpa o formulário
                    loadUsers(); // Recarrega a lista
                } else {
                    const errorData = await response.json();
                    createMessage.className = 'message error';
                    createMessage.textContent = errorData.msg || errorData.errors?.[0]?.msg || 'Erro ao criar usuário.';
                }
            } catch (error) {
                console.error('Erro ao criar usuário:', error);
                createMessage.className = 'message error';
                createMessage.textContent = 'Erro de conexão com o servidor.';
            }
        });

        document.addEventListener('DOMContentLoaded', async () => {
            await getAdminUser(); // Verifica se é admin
            loadUsers();
        });
    </script>
</body>
</html>
