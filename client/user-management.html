<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ADCON - Gerenciar Usuários</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/pages/user-management.css">
    <script src="js/config.js"></script>
</head>
<body style="display: none;">
    <!-- Script de bloqueio de acesso e exibição de conteúdo -->
    <script>
        if (localStorage.getItem('token')) {
            document.body.style.display = 'block';
        } else {
            window.location.replace('login.html');
        }
    </script>

    <div id="header-placeholder"></div>

    <div class="container">
        <h1>Gerenciar Usuários</h1>
        
        <div class="form-section">
            <h2>Criar Novo Usuário</h2>
            <form id="createUserForm">
                <div class="form-group">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" required>
                </div>
                <div class="form-group">
                    <label for="role">Perfil:</label>
                    <select id="role" name="role" required>
                        <option value="funcionario">Funcionário</option>
                        <option value="gerente">Gerente</option>
                        <option value="empresario">Empresário</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
                <button type="submit">Criar Usuário</button>
                <div id="createMessage" class="message"></div>
            </form>
        </div>

        <div class="list-section">
            <h2>Lista de Usuários</h2>
            <div class="table-responsive">
            <table id="usersTable">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Email</th>
                        <th>Perfil</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="4">Carregando usuários...</td></tr>
                </tbody>
            </table>
            </div>
        </div>
    </div>

    <!-- Modal de Edição de Usuário -->
    <div id="editUserModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); align-items:center; justify-content:center; z-index:1000;">
        <div style="background:white; padding:1.2rem; border-radius:8px; width:420px; max-width:95%; box-sizing:border-box; box-shadow:0 8px 24px rgba(0,0,0,0.2);">
            <h3 style="margin-top:0;">Editar Usuário</h3>
            <div style="margin-bottom:0.6rem;"><label style="display:block; font-weight:600;">Nome</label><input id="modal-nome" type="text" style="width:100%; padding:8px; box-sizing:border-box;"></div>
            <div style="margin-bottom:0.6rem;"><label style="display:block; font-weight:600;">Email</label><input id="modal-email" type="email" style="width:100%; padding:8px; box-sizing:border-box;"></div>
            <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:0.6rem;">
                <button id="modal-cancel" style="background:#6c757d; color:white; border:none; padding:8px 12px; border-radius:4px;">Cancelar</button>
                <button id="modal-save" style="background:#007bff; color:white; border:none; padding:8px 12px; border-radius:4px;">Salvar</button>
            </div>
        </div>
    </div>

    <script src="shared.js"></script>
    <script src="js/pages/user-management.js"></script>
    <script src="js/test-config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOM loaded, calling setupPage');
            setupPage();
        });
    </script>
</body>
</html>
